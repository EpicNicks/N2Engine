// The game's APK. Every game setting comes from n2build as a Gradle property (-Pn2.<name>=...), from project.n2proj's
// build.targets.android (docs/build-targets.html#settings): nothing here is a particular game's.
plugins {
    id 'com.android.application'
}

def n2 = { String key, String fallback -> (project.findProperty("n2.${key}") ?: fallback).toString() }
def engineRoot = file(n2('engineRoot', '../../..'))

android {
    namespace 'com.n2engine.player'
    compileSdk 35
    ndkVersion n2('ndkVersion', '27.0.12077973')

    defaultConfig {
        applicationId n2('appId', 'com.n2engine.game')
        // AAudio and ANativeWindow's RGBA buffers: Android 8.0
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(n2('buildNumber', '1'))
        versionName n2('version', '1.0.0')
        resValue 'string', 'app_name', n2('displayName', 'N2Engine Game')
        ndk {
            abiFilters(*n2('abis', 'arm64-v8a,x86_64').split(','))
        }
        externalNativeBuild {
            cmake {
                targets 'n2game'
                arguments '-DANDROID_STL=c++_shared',
                          "-DN2ENGINE_PROJECT=${n2('project', '')}",
                          '-DN2ENGINE_TARGET=android',
                          '-DN2ENGINE_BUILD_TESTS=OFF',
                          "-DCMAKE_BUILD_TYPE=${n2('cmakeBuildType', 'Release')}"
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            // The engine repository itself: its root CMakeLists.txt adds players/android/native when ANDROID is set
            path file("${engineRoot}/CMakeLists.txt")
            buildStagingDirectory file(n2('nativeBuildDir', "${buildDir}/n2native"))
        }
    }

    sourceSets {
        main {
            // game.n2pack (n2build's cook step) is the APK's only asset
            assets.srcDirs = [n2('assetsDir', "${buildDir}/n2assets")]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed by n2build's signing profile at build time (stage 9); unsigned until then
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.games:games-activity:3.0.5'
}

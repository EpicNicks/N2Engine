name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: windows (${{ matrix.config }}, PhysX ${{ matrix.physx }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            physx: "ON"
          # OFF keeps the no-physics build compiling and running (the engine then has no physics backend)
          - config: Debug
            physx: "OFF"
          # Release catches what Debug hides (NDEBUG, optimised SIMD paths) and confirms the forced sol2 safeties still hold in Release.
          # The PhysX release zip ships both debug/ and release/ libraries, so PhysX stays ON here.
          - config: Release
            physx: "ON"

    steps:
      - uses: actions/checkout@v7

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true
          stripdown: true

      - name: Cache PhysX binaries
        if: matrix.physx == 'ON'
        uses: actions/cache@v6
        with:
          path: external/PhysX/physx/bin
          # Not keyed per config: the downloaded zip holds the debug/ and release/ folders together
          key: physx-bin-${{ runner.os }}-v1

      - name: Configure
        run: cmake -S . -B build -A x64 -DN2ENGINE_BUILD_TESTS=ON -DN2ENGINE_USE_PHYSX=${{ matrix.physx }} # newest installed Visual Studio

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.config }} --output-on-failure
        env:
          # Silent OpenAL output device; the runner has no sound card
          ALSOFT_DRIVERS: "null"

      # Starts the editor host, talks to it over its TCP protocol, then asks it to shut down.
      # The runner has no GPU, so the window fails and the host serves without one.
      # A non-zero exit code catches crashes during shutdown or static destruction.
      - name: Editor host smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "build/bin/${{ matrix.config }}/N2EditorHost.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--port", "9999" -PassThru `
            -RedirectStandardOutput host.log -RedirectStandardError host.err
          $null = $proc.Handle # keeps ExitCode readable after the process exits

          try {
            $client = $null
            for ($i = 0; $i -lt 120 -and -not $client; $i++) {
              try { $client = [System.Net.Sockets.TcpClient]::new("127.0.0.1", 9999) }
              catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $client) { throw "Editor host never accepted a connection" }
            $client.ReceiveTimeout = 10000
            $stream = $client.GetStream()

            # Frames are [command: 1 byte][payload length: uint32 LE][payload]
            function Send-Command([byte]$type) {
              $bytes = [byte[]](@($type) + [BitConverter]::GetBytes([uint32]0))
              $stream.Write($bytes, 0, $bytes.Length)
            }
            function Read-Exact([int]$count) {
              $buffer = New-Object byte[] $count
              $offset = 0
              while ($offset -lt $count) {
                $read = $stream.Read($buffer, $offset, $count - $offset)
                if ($read -le 0) { throw "Connection closed after $offset of $count bytes" }
                $offset += $read
              }
              return ,$buffer
            }

            Send-Command 0x50 # GetEngineHealth
            $header = Read-Exact 5
            if ($header[0] -ne 0x09) { throw ("Expected EngineHealth response (0x09), got 0x{0:X2}" -f $header[0]) }
            $payload = Read-Exact ([BitConverter]::ToUInt32($header, 1))
            Write-Host "GetEngineHealth: $($payload.Length) bytes, healthy=$($payload[0])"

            Send-Command 0xFF # Shutdown
            $ok = Read-Exact 5
            if ($ok[0] -ne 0x00) { throw ("Expected Ok response (0x00) to Shutdown, got 0x{0:X2}" -f $ok[0]) }
            $client.Close()

            if (-not $proc.WaitForExit(30000)) {
              $proc.Kill()
              throw "Editor host did not exit within 30s of Shutdown"
            }
            if ($proc.ExitCode -ne 0) { throw ("Editor host exited with code 0x{0:X8}" -f $proc.ExitCode) }
            Write-Host "Editor host exited cleanly"
          }
          finally {
            if (-not $proc.HasExited) { $proc.Kill() }
            Write-Host "----- host stdout -----"; Get-Content host.log -ErrorAction SilentlyContinue
            Write-Host "----- host stderr -----"; Get-Content host.err -ErrorAction SilentlyContinue
          }

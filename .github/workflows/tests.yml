name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # One live run per pull request: a push to the PR (or an update-branch) cancels the run of the older head. Every other event
  # (push to master, workflow_dispatch) gets a group of its own (the run id), so it is never cancelled and never replaced by
  # a newer pending run, which a shared group without cancel-in-progress would do.
  group: tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether a pull request changes only documentation. docs_only is 'true' only on a pull_request whose changed files
  # (merge base of the base branch and the PR head, renames counted as a delete plus an add) are ALL under docs/ or are *.md
  # files in the repository root. Push (master) and workflow_dispatch always get 'false'. The jobs that build and test say
  # `needs: changes` and skip on 'true'. If this job fails, those jobs are skipped (their needs failed) and this job shows
  # red, so the run is red: a failure here never looks like success.
  changes:
    name: changes (docs-only check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT" = "pull_request" ]; then
            files=$(mktemp)
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$files"
            total=0
            other=0
            while IFS= read -r -d '' f; do
              total=$((total + 1))
              case "$f" in
                docs/*) ;;
                */*) other=$((other + 1)); echo "not docs: $f" ;;
                *.md) ;;
                *) other=$((other + 1)); echo "not docs: $f" ;;
              esac
            done < "$files"
            echo "changed files: $total, not docs: $other"
            if [ "$total" -gt 0 ] && [ "$other" -eq 0 ]; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # No build: the checked-in generated clients and golden vectors must be what the generators make from protocol.json
  # today, and the generated TypeScript codecs must agree with the vectors (the C++ side is checked by
  # ProtocolVectorTest in the windows job)
  protocol:
    name: protocol (generated clients, golden vectors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # For --experimental-strip-types (Node 22.6+), which runs the generated TypeScript without npm packages
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Regenerate the clients and golden vectors
        run: |
          for generator in cpp csharp typescript test_vectors; do
            python3 editor-server/protocol/generators/generate_$generator.py
          done

      - name: Fail if a generated file is out of date
        run: |
          changes=$(git status --porcelain -- editor-server/clients editor-server/protocol)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- editor-server/clients editor-server/protocol
            echo "::error::Generated protocol files are out of date: run the generators in editor-server/protocol/generators and commit the result"
            exit 1
          fi

      - name: Generator and TypeScript codec tests
        run: python3 editor-server/protocol/tests/run_tests.py

  windows:
    # A matrix job skipped by a job-level if reports ONE skipped check with an unexpanded name, not the three leg names, so
    # this job always runs and each step skips itself on a docs-only pull request (the legs keep their names and report success
    # after a few seconds on a runner).
    # Legs with the FreeType font backend or the ufbx FBX/OBJ importer say so in their name; the rest use stb_truetype and
    # glTF only
    name: windows (${{ matrix.config }}, PhysX ${{ matrix.physx }}${{ matrix.freetype == 'ON' && ', FreeType ON' || '' }}${{ matrix.ufbx == 'ON' && ', ufbx ON' || '' }}${{ matrix.tls == 'ON' && ', TLS ON' || '' }})
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # ccache (the same tool as the Linux legs): the cache is per leg (the prefix names the configuration and the options
      # that change the compiled code), so the legs never share objects
      CCACHE_KEY_PREFIX: ccache-windows-${{ matrix.config }}-physx${{ matrix.physx }}-tls${{ matrix.tls }}
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 1200M
      CCACHE_COMPRESS: "1"
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            physx: "ON"
            freetype: "OFF"
            ufbx: "OFF"
            tls: "OFF"
            strict: "OFF"
          # OFF keeps the no-physics build compiling and running (the engine then has no physics backend).
          # This leg also builds the optional FreeType font backend, so the text tests run against both
          # stb_truetype and FreeType (and compare them) without a fourth full build. It builds the optional ufbx
          # FBX/OBJ importer too, so the model tests read the committed FBX and compare it with the glTF cube. And the
          # optional editor-host TLS (Mbed TLS, vendored), so the TLS tests and a --tls host smoke test run here.
          - config: Debug
            physx: "OFF"
            freetype: "ON"
            ufbx: "ON"
            tls: "ON"
            strict: "OFF"
          # Release catches what Debug hides (NDEBUG, optimised SIMD paths) and confirms the forced sol2 safeties still hold in Release.
          # The PhysX release zip ships both debug/ and release/ libraries, so PhysX stays ON here.
          # N2ENGINE_STRICT_FP=ON on the Release leg only (stage J7: its corpus hashes go to the `determinism` job); Debug stays as it was
          - config: Release
            physx: "ON"
            freetype: "OFF"
            ufbx: "OFF"
            tls: "OFF"
            strict: "ON"

    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'

      - name: Install Vulkan SDK
        if: needs.changes.outputs.docs_only != 'true'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true
          stripdown: true

      - name: Cache PhysX binaries
        if: needs.changes.outputs.docs_only != 'true' && (matrix.physx == 'ON')
        uses: actions/cache@v6
        with:
          path: external/PhysX/physx/bin
          # Not keyed per config: the downloaded zip holds the debug/ and release/ folders together. The pinned
          # version and hash are in cmake/PhysXWindowsHashes.cmake; CMake checks the stamp in the extracted tree.
          key: physx-bin-${{ runner.os }}-${{ hashFiles('cmake/PhysXWindowsHashes.cmake') }}

      # ccache, pinned to one release and checked against its SHA-256 (the zip is not installed from a package feed). If the
      # download or the check fails the step only warns: the Configure step uses ccache when it is on the PATH and builds
      # without it otherwise.
      - name: Install ccache
        if: needs.changes.outputs.docs_only != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $version = '4.10.2'
          $sha256 = '6252f081876a9a9f700fae13a5aec5d0d486b28261d7f1f72ac11c7ad9df4da9'
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$version/ccache-$version-windows-x86_64.zip" -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $sha256) { throw "ccache zip hash mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP 'ccache'
          Expand-Archive -Path $zip -DestinationPath $dest
          $bin = Join-Path $dest "ccache-$version-windows-x86_64"
          & (Join-Path $bin 'ccache.exe') --version
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      # The Ninja generator does not set up the compiler itself (the Visual Studio generator did): run the official
      # vcvars64.bat of the newest installed Visual Studio and export what it changed (PATH, INCLUDE, LIB, ...) to the
      # later steps, so CMake finds cl.exe, link.exe, rc.exe and the Windows SDK.
      - name: Set up the Visual Studio x64 environment
        if: needs.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio with the x64 C++ tools was found' }
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $bat)) { throw "Missing $bat" }
          $before = @{}
          foreach ($e in Get-ChildItem Env:) { $before[$e.Name] = $e.Value }
          $lines = cmd /c "`"$bat`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed ($LASTEXITCODE)" }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$') {
              if ($before[$Matches[1]] -ne $Matches[2]) { Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])" }
            }
          }
          Write-Host "Visual Studio: $vs"

      # ccache: PRs only restore the cache that master pushes saved; a miss or a failure only means a cold build
      - name: Restore ccache
        id: ccache-restore
        if: needs.changes.outputs.docs_only != 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ${{ env.CCACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CCACHE_KEY_PREFIX }}-

      - name: Reset ccache statistics
        if: needs.changes.outputs.docs_only != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          if (Get-Command ccache -ErrorAction SilentlyContinue) {
            New-Item -ItemType Directory -Force -Path $env:CCACHE_DIR | Out-Null
            ccache --zero-stats
            ccache --show-config | Select-String -Pattern ' (cache_dir|max_size|base_dir|hash_dir|compiler_check) = '
          } else {
            Write-Host 'ccache is not installed: cold build without a compiler cache'
          }

      # Ninja Multi-Config keeps the build/bin/<Config>/ layout of the Visual Studio generator (the smoke tests and
      # PlaySmokeTest.ps1 use it), but unlike that generator it accepts a compiler launcher. cl.exe is named explicitly
      # (the runner also has MinGW and Strawberry Perl compilers on the PATH). CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      # is /Z7 (debug info in the object file, no shared compiler PDB) for Debug only; the CMP0141 default makes it count
      # in the fetched dependencies (OpenAL Soft, googletest, ...) whose own cmake_minimum_required is older than 3.25.
      - name: Configure
        if: needs.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          $launcher = @()
          if (Get-Command ccache -ErrorAction SilentlyContinue) {
            $launcher = @('-DCMAKE_C_COMPILER_LAUNCHER=ccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache')
          }
          cmake -S . -B build -G 'Ninja Multi-Config' -DCMAKE_CONFIGURATION_TYPES=${{ matrix.config }} -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_POLICY_DEFAULT_CMP0141=NEW '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=$<$<CONFIG:Debug>:Embedded>' $launcher -DN2ENGINE_BUILD_TESTS=ON -DN2ENGINE_USE_JOLT=ON -DN2ENGINE_USE_PHYSX=${{ matrix.physx }} -DN2ENGINE_TEXT_FREETYPE=${{ matrix.freetype }} -DN2ENGINE_MODEL_UFBX=${{ matrix.ufbx }} -DN2ENGINE_EDITOR_TLS=${{ matrix.tls }} -DN2ENGINE_STRICT_FP=${{ matrix.strict }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: cmake --build build --config ${{ matrix.config }} --parallel

      # The vendored Jolt Physics (N2ENGINE_USE_JOLT): its smoke test (the library alone) run directly, because ctest
      # hides a passing test's output, so this leg's [JOLT-DETERMINISM] line (the state hash every leg must produce) is in this
      # job's log and summary
      - name: Jolt determinism numbers
        if: needs.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          & "./build/bin/${{ matrix.config }}/jolt_smoke_tests.exe" | Tee-Object -FilePath jolt-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY 'windows ${{ matrix.config }}, PhysX ${{ matrix.physx }}:'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Select-String -Path jolt-smoke.log -Pattern '^\[JOLT-DETERMINISM\]' | ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY ('    ' + $_.Line) }
          Add-Content $env:GITHUB_STEP_SUMMARY ''

      # The Jolt BACKEND (engine/src/physics/jolt) stepping one scene twice in a process: its [JOLT-BACKEND-DETERMINISM] lines
      # (compiler, job system, declared level, and the state hashes after 60 and 240 steps) are in this job's log and summary.
      # The hashes must be equal on every leg that builds the backend: a difference is a finding, never a number to loosen
      - name: Jolt backend determinism numbers
        if: needs.changes.outputs.docs_only != 'true'
        shell: pwsh
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          & "./build/bin/${{ matrix.config }}/engine_tests.exe" --gtest_filter='JoltBackendDeterminismTest.*' | Tee-Object -FilePath jolt-backend.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY 'windows ${{ matrix.config }}, PhysX ${{ matrix.physx }}:'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Select-String -Path jolt-backend.log -Pattern '^\[JOLT-BACKEND-DETERMINISM\]' | ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY ('    ' + $_.Line) }
          Add-Content $env:GITHUB_STEP_SUMMARY ''

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        run: ctest --test-dir build --build-config ${{ matrix.config }} --output-on-failure --timeout 600
        env:
          # Silent OpenAL output device; the runner has no sound card
          ALSOFT_DRIVERS: "null"

      # ctest hides a passing test's output: run the PhysX determinism tests again directly (Release PhysX leg only), so
      # their [DETERMINISM] lines (divergence steps, state hashes) appear in this job's log
      - name: PhysX determinism numbers
        if: needs.changes.outputs.docs_only != 'true' && matrix.config == 'Release' && matrix.physx == 'ON'
        shell: pwsh
        run: ./build/bin/Release/engine_tests.exe --gtest_filter='*PhysXDeterminism*'

      # The real editor host, end to end (tests/smoke/editor_host_smoke.py, Python 3 standard library only; the Linux leg
      # runs the same script). Creates a project as a launcher would (--create, which must not start the engine), starts
      # the host on it (--port 0, then the port from its ready line) with the windowless software renderer and an access
      # token from the environment (--token-env), talks to it over its TCP protocol (Hello, the startup scene, a rendered
      # frame, audio, saving and reopening the scene, the hierarchy, the project, assets), then asks it to shut down. A
      # second host runs with the default renderer, whose window fails on the GPU-less runner so it serves without one,
      # and with --exit-on-disconnect, so it must exit by itself when its client leaves. Hosts with --exit-on-stdin-eof
      # must exit when their stdin closes (a pipe the test closes, and an empty file), and keep running while it is
      # open; one without the flag must keep running when its stdin is at end of file. A non-zero exit code catches
      # crashes during shutdown or static destruction.
      - name: Editor host smoke test
        if: needs.changes.outputs.docs_only != 'true'
        shell: pwsh
        env:
          N2_SMOKE_CONFIG: ${{ matrix.config }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/smoke/editor_host_smoke.py --scenario host --config $env:N2_SMOKE_CONFIG --exe "build/bin/$env:N2_SMOKE_CONFIG/N2EditorHost.exe"

      # The real host with --tls (the TLS leg only; the unit tests cover the handshake and the gate): it makes its
      # certificate in the user's data folder, prints it in the ready line, and a client that checks that fingerprint
      # finishes a handshake, says Hello and gets ServerInfo; a restarted host presents the same certificate.
      # --exit-on-disconnect ends the host when the client leaves.
      - name: Editor host TLS smoke test
        if: needs.changes.outputs.docs_only != 'true' && (matrix.tls == 'ON')
        shell: pwsh
        env:
          N2_SMOKE_CONFIG: ${{ matrix.config }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/smoke/editor_host_smoke.py --scenario tls --config $env:N2_SMOKE_CONFIG --exe "build/bin/$env:N2_SMOKE_CONFIG/N2EditorHost.exe"

      # What the Electron editor does for play mode, with the real binary on the software renderer (see the script's
      # header): an edit host writes a play snapshot (WritePlaySnapshot) of its unsaved scene, a second process
      # (N2EditorHost --play <snapshot> with the same --project and --renderer) plays it, and the test checks the script
      # ran, frames advance beside a busy client, pause, step, input, RenderFrame and Shutdown, that the edit host and its
      # scene file are untouched, and that --exit-on-disconnect and a missing snapshot end the child as documented.
      - name: Play child smoke test
        if: needs.changes.outputs.docs_only != 'true'
        shell: pwsh
        env:
          N2_SMOKE_CONFIG: ${{ matrix.config }}
        run: ./tests/editor-server/PlaySmokeTest.ps1 -Config $env:N2_SMOKE_CONFIG

      # The physics determinism corpus (stage J7), on the strict Release leg only: the same steps as the Linux legs. The hashes
      # go to the `determinism` job as an artifact.
      - name: Physics determinism corpus
        if: needs.changes.outputs.docs_only != 'true' && matrix.config == 'Release' && matrix.physx == 'ON' && !cancelled()
        shell: pwsh
        env:
          ALSOFT_DRIVERS: "null"
          N2_DETERMINISM_LEG: windows-release
          N2_DETERMINISM_HASHES_OUT: ${{ github.workspace }}\determinism-hashes.json
        run: |
          & "./build/bin/Release/engine_tests.exe" --gtest_filter='PhysicsDeterminismCorpusTest.*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the determinism hashes
        if: needs.changes.outputs.docs_only != 'true' && matrix.config == 'Release' && matrix.physx == 'ON' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: determinism-hashes-windows-release
          path: determinism-hashes.json
          if-no-files-found: warn
          retention-days: 30

      # The golden replay corpus (netcode C2), on the strict Release leg only: the same steps as the Linux legs. The hashes go to
      # the `golden-replay` job as an artifact.
      - name: Golden replay hashes
        if: needs.changes.outputs.docs_only != 'true' && matrix.config == 'Release' && matrix.physx == 'ON' && !cancelled()
        shell: pwsh
        env:
          ALSOFT_DRIVERS: "null"
          N2_REPLAY_LEG: windows-release
          N2_REPLAY_HASHES_OUT: ${{ github.workspace }}\replay-hashes.json
        run: |
          & "./build/bin/Release/engine_tests.exe" --gtest_filter='GoldenReplayCorpusTest.*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the replay hashes
        if: needs.changes.outputs.docs_only != 'true' && matrix.config == 'Release' && matrix.physx == 'ON' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: replay-hashes-windows-release
          path: replay-hashes.json
          if-no-files-found: warn
          retention-days: 30

      # Runs after a failed build or test too (not when cancelled): the hit rate of this run, from zeroed statistics
      - name: ccache statistics
        if: needs.changes.outputs.docs_only != 'true' && !cancelled()
        continue-on-error: true
        shell: pwsh
        run: |
          if (Get-Command ccache -ErrorAction SilentlyContinue) {
            $restored = '${{ steps.ccache-restore.outputs.cache-matched-key }}'
            if (-not $restored) { $restored = 'none (cold build)' }
            $stats = ccache -s | Out-String
            $fence = '```'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### ccache (${{ env.CCACHE_KEY_PREFIX }})`nrestored cache: $restored`n$fence`n$stats$fence"
            Write-Host $stats
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### ccache (${{ env.CCACHE_KEY_PREFIX }})`nccache was not installed: cold build, nothing to save"
          }

      # Only a push to master saves (never a pull request, never workflow_dispatch); master runs are never cancelled, so a
      # partial cache from a cancelled run cannot be saved. Entries are immutable, so the key carries the run id.
      - name: Save ccache
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master' && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ env.CCACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The Linux build: the engine, renderer, editor host and unit tests with Clang 20 (apt.llvm.org) on the GCC 14 standard
  # library (libstdc++ 14). Clang 18, ubuntu-24.04's own, cannot use libstdc++ 14's std::expected (it needs the C++20
  # concepts feature level Clang 19 added) and libc++ 18 has no std::generator or std::chrono::clock_cast, so Clang 20 is
  # installed. PhysX is ON (the pinned static Linux archive, downloaded and hash-checked by CMake, cached per architecture);
  # FreeType, ufbx and TLS are ON so the optional backends compile here too. The editor host smoke tests run here too, the same Python script as on Windows. This is the required Linux check.
  linux:
    name: linux (Release, x86_64, Clang)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: clang-20
      CXX: clang++-20
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/keyrings/apt.llvm.org.asc
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-20 libstdc++-14-dev cmake ninja-build python3             libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libasound2-dev ccache

      # The runners have no GPU: Mesa lavapipe (mesa-vulkan-drivers) is the Vulkan driver, so renderer_tests really run the
      # Vulkan renderer, with the Khronos validation layer (vulkan-validationlayers) on. Its ICD file is
      # lvp_icd.<arch>.json on older Mesa and lvp_icd.json on newer: pin whichever is installed (so the loader can't pick
      # anything else), and fail here, not in the tests, when there is none.
      - name: Select the lavapipe Vulkan driver
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -n "$icd"
          echo "Using $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

      - name: Cache PhysX binaries
        uses: actions/cache@v6
        with:
          path: external/PhysX/physx/bin
          # The pinned version and hashes are in cmake/PhysXLinuxHashes.cmake; CMake checks the extracted archive's hash
          # stamp, so a stale or foreign cache is re-downloaded, never trusted
          key: physx-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/PhysXLinuxHashes.cmake') }}

      # ccache: PRs only restore the cache that master pushes saved (a PR's own cache would not be readable by other PRs
      # and would evict it); the cache is per leg and compiler, so the legs never share one. A miss or a failure here
      # only means a cold build.
      - name: Restore ccache
        id: ccache-restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-linux-x86_64-clang20-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-linux-x86_64-clang20-

      - name: Reset ccache statistics
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          ccache --show-config | grep -E " (cache_dir|max_size|base_dir|hash_dir|compiler_check) = " || true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14" -DN2ENGINE_BUILD_TESTS=ON -DN2ENGINE_USE_JOLT=ON -DN2ENGINE_USE_PHYSX=ON -DN2ENGINE_STRICT_FP=ON -DN2ENGINE_EDITOR_TLS=ON -DN2ENGINE_TEXT_FREETYPE=ON -DN2ENGINE_MODEL_UFBX=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel --target N2EditorHost N2Server math_tests text_tests assetimport_tests engine_tests renderer_tests editor_server_tests editor_project_tests n2server_tests n2server_smoke_client n2server_net_host n2server_net_client n2server_lockstep_client n2server_rollback_client n2_replay websocket_echo jolt_smoke_tests -- -k 0

      # The vendored Jolt Physics tree is exactly upstream's v5.6.0 (the SHA-256 of every file, no extra file under Jolt/)
      - name: Check the vendored Jolt Physics tree
        run: bash scripts/check-jolt-vendor.sh

      # The vendored Jolt Physics (N2ENGINE_USE_JOLT): its smoke test (the library alone) run directly, because ctest
      # hides a passing test's output, so this leg's [JOLT-DETERMINISM] line (the state hash every leg must produce, the
      # first cross-platform determinism data point) is in this job's log and summary
      - name: Jolt determinism numbers
        run: |
          set -o pipefail
          ./build/bin/jolt_smoke_tests | tee jolt-smoke.log

name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # No build: the checked-in generated clients and golden vectors must be what the generators make from protocol.json
  # today, and the generated TypeScript codecs must agree with the vectors (the C++ side is checked by
  # ProtocolVectorTest in the windows job)
  protocol:
    name: protocol (generated clients, golden vectors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # For --experimental-strip-types (Node 22.6+), which runs the generated TypeScript without npm packages
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Regenerate the clients and golden vectors
        run: |
          for generator in cpp csharp typescript test_vectors; do
            python3 editor-server/protocol/generators/generate_$generator.py
          done

      - name: Fail if a generated file is out of date
        run: |
          changes=$(git status --porcelain -- editor-server/clients editor-server/protocol)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- editor-server/clients editor-server/protocol
            echo "::error::Generated protocol files are out of date: run the generators in editor-server/protocol/generators and commit the result"
            exit 1
          fi

      - name: Generator and TypeScript codec tests
        run: python3 editor-server/protocol/tests/run_tests.py

  windows:
    # Legs with the FreeType font backend or the ufbx FBX/OBJ importer say so in their name; the rest use stb_truetype and
    # glTF only
    name: windows (${{ matrix.config }}, PhysX ${{ matrix.physx }}${{ matrix.freetype == 'ON' && ', FreeType ON' || '' }}${{ matrix.ufbx == 'ON' && ', ufbx ON' || '' }}${{ matrix.tls == 'ON' && ', TLS ON' || '' }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            physx: "ON"
            freetype: "OFF"
            ufbx: "OFF"
            tls: "OFF"
          # OFF keeps the no-physics build compiling and running (the engine then has no physics backend).
          # This leg also builds the optional FreeType font backend, so the text tests run against both
          # stb_truetype and FreeType (and compare them) without a fourth full build. It builds the optional ufbx
          # FBX/OBJ importer too, so the model tests read the committed FBX and compare it with the glTF cube. And the
          # optional editor-host TLS (Mbed TLS, vendored), so the TLS tests and a --tls host smoke test run here.
          - config: Debug
            physx: "OFF"
            freetype: "ON"
            ufbx: "ON"
            tls: "ON"
          # Release catches what Debug hides (NDEBUG, optimised SIMD paths) and confirms the forced sol2 safeties still hold in Release.
          # The PhysX release zip ships both debug/ and release/ libraries, so PhysX stays ON here.
          - config: Release
            physx: "ON"
            freetype: "OFF"
            ufbx: "OFF"
            tls: "OFF"

    steps:
      - uses: actions/checkout@v7

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true
          stripdown: true

      - name: Cache PhysX binaries
        if: matrix.physx == 'ON'
        uses: actions/cache@v6
        with:
          path: external/PhysX/physx/bin
          # Not keyed per config: the downloaded zip holds the debug/ and release/ folders together
          key: physx-bin-${{ runner.os }}-v1

      - name: Configure
        run: cmake -S . -B build -A x64 -DN2ENGINE_BUILD_TESTS=ON -DN2ENGINE_USE_PHYSX=${{ matrix.physx }} -DN2ENGINE_TEXT_FREETYPE=${{ matrix.freetype }} -DN2ENGINE_MODEL_UFBX=${{ matrix.ufbx }} -DN2ENGINE_EDITOR_TLS=${{ matrix.tls }} # newest installed Visual Studio

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.config }} --output-on-failure
        env:
          # Silent OpenAL output device; the runner has no sound card
          ALSOFT_DRIVERS: "null"

      # Creates a project as a launcher would (--create, which must not start the engine), then starts the editor host
      # on it (--port 0, then the port from its ready line) with the windowless software renderer and an access token
      # from the environment (--token-env), talks to it over its TCP protocol (Hello, the startup scene, a rendered
      # frame, audio, saving and reopening the scene, the project, assets), then asks it to shut down. A second host runs with the
      # default renderer, whose window fails on the GPU-less runner so it serves without one, and with
      # --exit-on-disconnect, so it must exit by itself when its client leaves. Hosts with --exit-on-stdin-eof must
      # exit when their stdin closes (a pipe the test closes, and an empty file), and keep running while it is open;
      # one without the flag must keep running when its stdin is at end of file.
      # A non-zero exit code catches crashes during shutdown or static destruction.
      - name: Editor host smoke test
        shell: pwsh
        # The configuration comes in through env, not an expression in the script: GitHub refuses a run block over 21000
        # characters that contains an expression.
        env:
          N2_SMOKE_CONFIG: ${{ matrix.config }}
        run: |
          $exe = Resolve-Path "build/bin/$env:N2_SMOKE_CONFIG/N2EditorHost.exe"
          $protocolVersion = (Get-Content editor-server/protocol/protocol.json -Raw | ConvertFrom-Json).version

          # --create: CPU only (no engine, so no renderer or audio lines), exactly one line on stdout, exit code 0; a
          # second --create on the same folder changes nothing and exits with 2. The folder name has a space, as a
          # user's would.
          $project = Join-Path $env:RUNNER_TEMP "n2 smoke project"
          Remove-Item $project -Recurse -Force -ErrorAction SilentlyContinue
          $createOut = Join-Path $PWD "create.out"
          $createErr = Join-Path $PWD "create.err"
          $create = Start-Process -FilePath $exe -PassThru -Wait -NoNewWindow `
            -ArgumentList "--create", "`"$project`"", "--name", "`"Smoke Project`"" `
            -RedirectStandardOutput $createOut -RedirectStandardError $createErr
          $createLines = @(Get-Content $createOut)
          Write-Host "--create (exit $($create.ExitCode)):"; $createLines | ForEach-Object { Write-Host "  $_" }
          Get-Content $createErr -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  stderr: $_" }
          if ($create.ExitCode -ne 0) { throw "--create exited with $($create.ExitCode)" }
          if ($createLines.Count -ne 1 -or $createLines[0] -notmatch '^N2EditorHost created (?:.* )?projectId=([0-9a-f-]{36})(?: |$)') {
            throw "--create didn't print exactly its created line"
          }
          $projectId = $Matches[1]
          if ($createLines[0] -notmatch ' startupScene=res://scenes/Main\.scene(?: |$)') { throw "--create: no startup scene in its line" }
          $projectFile = Get-Content (Join-Path $project "project.n2proj") -Raw | ConvertFrom-Json
          if ($projectFile.projectId -ne $projectId -or $projectFile.name -ne "Smoke Project") { throw "project.n2proj doesn't match the created line" }
          if (-not (Test-Path (Join-Path $project "assets/scenes/Main.scene"))) { throw "--create made no Main.scene" }
          $before = Get-Content (Join-Path $project "project.n2proj") -Raw
          $again = Start-Process -FilePath $exe -PassThru -Wait -NoNewWindow -ArgumentList "--create", "`"$project`"" `
            -RedirectStandardOutput $createOut -RedirectStandardError $createErr
          if ($again.ExitCode -ne 2) { throw "--create on a project exited with $($again.ExitCode), expected 2" }
          if ((Get-Content (Join-Path $project "project.n2proj") -Raw) -ne $before) { throw "--create on a project changed project.n2proj" }
          Write-Host "--create: project $projectId; again: exit 2, unchanged"

          # --project on a folder that isn't a project fails before the engine starts (exit 1); one an older host opened
          # (it has .import/) is told how to adopt it keeping its asset UUIDs
          $plain = Join-Path $env:RUNNER_TEMP "n2-not-a-project"
          Remove-Item $plain -Recurse -Force -ErrorAction SilentlyContinue
          $null = New-Item -ItemType Directory -Force (Join-Path $plain ".import")
          $notProject = Start-Process -FilePath $exe -PassThru -Wait -NoNewWindow -ArgumentList "--project", "`"$plain`"", "--port", "0" `
            -RedirectStandardOutput $createOut -RedirectStandardError $createErr
          $notProjectErr = Get-Content $createErr -Raw
          Write-Host "--project on a plain folder (exit $($notProject.ExitCode)): $notProjectErr"
          if ($notProject.ExitCode -ne 1) { throw "--project on a folder without project.n2proj exited with $($notProject.ExitCode), expected 1" }
          if (-not "$notProjectErr".Contains("--project-id from-path")) { throw "--project on a folder with .import/ didn't suggest --create --project-id from-path" }
          if ((Get-Content $createOut -Raw) -match 'N2EditorHost ready') { throw "--project on a plain folder printed a ready line" }

          # One more asset: the host's ResourceLoader writes its .meta under .import/ at startup
          Set-Content (Join-Path $project "assets/startup.mat") "{}"

          # The asset's .meta: its UUID must be a real one (all zeros means ResourceUUID wasn't initialised)
          function Assert-Meta([string]$name) {
            $meta = Join-Path $project ".import/$name.meta"
            if (-not (Test-Path $meta)) { throw "No metadata for $name at $meta" }
            $uuid = (Get-Content $meta -Raw | ConvertFrom-Json).uuid
            if (-not $uuid -or $uuid -eq "00000000-0000-0000-0000-000000000000") { throw "$name has no asset UUID: '$uuid'" }
            Write-Host "$name.meta: uuid $uuid"
          }

          # The port from the host's ready line ("N2EditorHost ready " then key=value fields, port among them), which
          # comes once the server listens. Matched with the launcher regex from logging-and-editor.html#ready-line, so
          # port needn't be first. Only complete lines count, each with its trailing \r stripped (the host's stdout is
          # in text mode, so lines end in \r\n, and .NET's $ doesn't match before a \r). The log is read with sharing,
          # as the host has it open.
          function Wait-ReadyLine($proc, [string]$logPath) {
            $port = $null
            $text = ""
            $readError = $null
            $watch = [System.Diagnostics.Stopwatch]::StartNew()
            for ($i = 0; $i -lt 240 -and -not $port; $i++) {
              try {
                $file = [System.IO.File]::Open($logPath, 'Open', 'Read', 'ReadWrite')
                try { $text = [System.IO.StreamReader]::new($file).ReadToEnd() } finally { $file.Dispose() }
                $readError = $null
              } catch { $readError = $_.Exception.Message }
              $end = $text.LastIndexOf("`n")
              if ($end -ge 0) {
                # Up to and including the last \n: the ready line is often the last complete line
                foreach ($line in ($text.Substring(0, $end + 1) -split "`n")) {
                  if ($line.TrimEnd("`r") -match '^N2EditorHost ready (?:.* )?port=(\d+)(?: |$)') { $port = [int]$Matches[1]; break }
                }
              }
              if (-not $port) {
                if ($proc.HasExited) { throw "Editor host exited (code $($proc.ExitCode)) before its ready line" }
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $port) {
              $tail = if ($text.Length -gt 2000) { $text.Substring($text.Length - 2000) } else { $text }
              $escaped = $tail.Replace("`r", '\r').Replace("`n", "\n`n")
              Write-Host "Waited $([int]$watch.Elapsed.TotalSeconds) s; last read error: $(if ($readError) { $readError } else { 'none' })"
              Write-Host "Read $($text.Length) chars of stdout; the last 2000, escaped:`n$escaped"
              throw "Editor host never printed its ready line"
            }
            if ($port -lt 1 -or $port -gt 65535) { throw "Ready line has an invalid port: $port" }
            Write-Host "Editor host ready on port $port"
            return $port
          }

          # Listening before the ready line, so the first attempt should connect; a few retries for safety
          function Connect-Host([int]$port) {
            $client = $null
            for ($i = 0; $i -lt 10 -and -not $client; $i++) {
              try { $client = [System.Net.Sockets.TcpClient]::new("127.0.0.1", $port) }
              catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $client) { throw "Editor host never accepted a connection on port $port" }
            $client.ReceiveTimeout = 10000
            return $client
          }

          # Frames are [type: 1 byte][payload length: uint32 LE][payload], both ways
          function Send-Frame($stream, [byte]$type, [byte[]]$payload = @()) {
            $bytes = [byte[]](@($type) + [BitConverter]::GetBytes([uint32]$payload.Length) + $payload)
            $stream.Write($bytes, 0, $bytes.Length)
          }
          function Read-Exact($stream, [int]$count) {
            $buffer = New-Object byte[] $count
            $offset = 0
            while ($offset -lt $count) {
              $read = $stream.Read($buffer, $offset, $count - $offset)
              if ($read -le 0) { throw "Connection closed after $offset of $count bytes" }
              $offset += $read
            }
            return ,$buffer
          }
          function Read-Response($stream) {
            $header = Read-Exact $stream 5
            $payload = Read-Exact $stream ([BitConverter]::ToUInt32($header, 1))
            return @{ Type = $header[0]; Payload = $payload }
          }
          # Error's payload is its message, as raw UTF-8
          function Assert-Response($response, [byte]$expected, [string]$what) {
            if ($response.Type -ne $expected) {
              throw ("{0}: expected response 0x{1:X2}, got 0x{2:X2}: {3}" -f $what, $expected, $response.Type,
                [Text.Encoding]::UTF8.GetString($response.Payload))
            }
          }
          # True once the host has closed the connection (a read returns 0, or the connection was reset)
          function Test-ClosedByHost($stream) {
            try { return $stream.Read((New-Object byte[] 1), 0, 1) -eq 0 }
            catch [System.IO.IOException] {
              $socketError = $_.Exception.InnerException
              return -not ($socketError -is [System.Net.Sockets.SocketException] -and $socketError.SocketErrorCode -eq 'TimedOut')
            }
          }

          # Hello: clientName, protocolVersion, token (strings: [uint32 byte count][UTF-8]).
          # ServerInfo (0x0B) answers: protocolVersion, engineVersion, capabilities (JSON text), projectLoaded
          function Get-StringBytes([string]$text) {
            $utf8 = [Text.Encoding]::UTF8.GetBytes($text)
            return ,[byte[]]([BitConverter]::GetBytes([uint32]$utf8.Length) + $utf8)
          }
          function Get-HelloPayload([string]$token) {
            return ,[byte[]]((Get-StringBytes "CI smoke test") + (Get-StringBytes $protocolVersion) + (Get-StringBytes $token))
          }

          # A string field at $offset ([uint32 byte count][UTF-8]); $offset moves past it
          function Read-WireString([byte[]]$payload, [ref]$offset) {
            $length = [BitConverter]::ToUInt32($payload, $offset.Value)
            $text = [Text.Encoding]::UTF8.GetString($payload, $offset.Value + 4, $length)
            $offset.Value += 4 + $length
            return $text
          }
          # SceneInfo (0x0D): path, name, uuid (strings), revision, savedRevision (uint32)
          function Get-SceneInfo($response, [string]$what) {
            Assert-Response $response 0x0D $what
            $offset = 0
            $info = @{
              Path = Read-WireString $response.Payload ([ref]$offset)
              Name = Read-WireString $response.Payload ([ref]$offset)
              Uuid = Read-WireString $response.Payload ([ref]$offset)
            }
            $info.Revision = [BitConverter]::ToUInt32($response.Payload, $offset)
            $info.SavedRevision = [BitConverter]::ToUInt32($response.Payload, $offset + 4)
            Write-Host "${what}: '$($info.Path)' ($($info.Name), $($info.Uuid)), revision $($info.Revision), saved $($info.SavedRevision)"
            return $info
          }

          # EngineHealth (0x09): healthy, then a uint32 count of (name, state, detail) strings. As a name -> state map.
          function Get-SubsystemStates([byte[]]$payload) {
            $states = @{}
            $offset = 1
            $count = [BitConverter]::ToUInt32($payload, $offset); $offset += 4
            for ($i = 0; $i -lt $count; $i++) {
              $fields = @()
              for ($f = 0; $f -lt 3; $f++) {
                $length = [BitConverter]::ToUInt32($payload, $offset); $offset += 4
                $fields += [Text.Encoding]::UTF8.GetString($payload, $offset, $length); $offset += $length
              }
              $states[$fields[0]] = $fields[1]
              Write-Host "  $($fields[0]): $($fields[1]) ($($fields[2]))"
            }
            return $states
          }

          $logPath = Join-Path $PWD "host.log"
          $errPath = Join-Path $PWD "host.err"
          $logPath2 = Join-Path $PWD "host-exit-on-disconnect.log"
          $errPath2 = Join-Path $PWD "host-exit-on-disconnect.err"
          $proc = $null
          $proc2 = $null
          $procPipe = $null
          $procEof = $null
          $procNoFlag = $null
          $emptyStdin = Join-Path $PWD "empty-stdin.txt"
          Set-Content -Path $emptyStdin -Value "" -NoNewline
          $logPathEof = Join-Path $PWD "host-stdin-eof.log"
          $errPathEof = Join-Path $PWD "host-stdin-eof.err"
          $logPathNoFlag = Join-Path $PWD "host-no-stdin-flag.log"
          $errPathNoFlag = Join-Path $PWD "host-no-stdin-flag.err"

          try {
            # ---- Host 1: --renderer software, --token-env, --project ----
            # The token is only in the environment the host inherits, never on its command line
            $token = [guid]::NewGuid().ToString("N")
            $env:N2_SMOKE_TOKEN = $token
            $proc = Start-Process -FilePath $exe -PassThru `
              -ArgumentList "--port", "0", "--project", "`"$project`"", "--renderer", "software", "--token-env", "N2_SMOKE_TOKEN" `
              -RedirectStandardOutput $logPath -RedirectStandardError $errPath
            $null = $proc.Handle # keeps ExitCode readable after the process exits
            Remove-Item Env:N2_SMOKE_TOKEN

            $port = Wait-ReadyLine $proc $logPath

            # The host has an access token: a wrong one is refused, and the connection closed
            $client = Connect-Host $port
            $stream = $client.GetStream()
            Send-Frame $stream 0x04 (Get-HelloPayload "not the token")
            $response = Read-Response $stream
            Assert-Response $response 0x01 "Hello with a wrong token"
            if (-not (Test-ClosedByHost $stream)) { throw "The host kept a connection open after refusing its Hello" }
            $client.Close()
            Write-Host "Hello with a wrong token: refused, connection closed"

            $client = Connect-Host $port
            $stream = $client.GetStream()
            Send-Frame $stream 0x04 (Get-HelloPayload $token)
            $response = Read-Response $stream
            Assert-Response $response 0x0B "Hello with the token"
            $payload = $response.Payload
            $serverVersionLength = [BitConverter]::ToUInt32($payload, 0)
            $serverVersion = [Text.Encoding]::UTF8.GetString($payload, 4, $serverVersionLength)
            if ($serverVersion -ne $protocolVersion) { throw "Hello: the host speaks protocol $serverVersion, protocol.json is $protocolVersion" }
            # The last byte is projectLoaded: this host was started with --project
            if ($payload[$payload.Length - 1] -ne 1) { throw "Hello: the host reports no project loaded" }
            Write-Host "Hello: protocol $serverVersion, project loaded"

            # The event ring kept the startup lines: RunHost constructs the server before Application::Init, so lines
            # Init logs itself are there. PollEvents (0x05): epoch, afterSeq, maxEvents (uint32 each); Events (0x0C):
            # epoch, nextSeq, dropped (uint32 each), then the events as a json field (a string: byte count, UTF-8 JSON),
            # searched here as text
            Send-Frame $stream 0x05 ([byte[]]([BitConverter]::GetBytes([uint32]0) + [BitConverter]::GetBytes([uint32]0) + [BitConverter]::GetBytes([uint32]1024)))
            $response = Read-Response $stream
            Assert-Response $response 0x0C "PollEvents"
            # The place to read on from later: this poll's epoch and nextSeq
            $pollEpoch = [BitConverter]::ToUInt32($response.Payload, 0)
            $pollNextSeq = [BitConverter]::ToUInt32($response.Payload, 4)
            $eventsText = [Text.Encoding]::UTF8.GetString($response.Payload, 12, $response.Payload.Length - 12)
            foreach ($line in "Camera initialized", "Using Software renderer, headless (no window)") {
              if (-not $eventsText.Contains($line)) { throw "PollEvents: no '$line' among the startup events (was the server constructed after Init?)" }
            }
            Write-Host "PollEvents: $($response.Payload.Length) bytes, startup lines present"

            # The software renderer runs with no window, even on this GPU-less runner
            Send-Frame $stream 0x50 # GetEngineHealth
            $response = Read-Response $stream
            Assert-Response $response 0x09 "GetEngineHealth"
            Write-Host "GetEngineHealth: healthy=$($response.Payload[0])"
            $states = Get-SubsystemStates $response.Payload
            if ($states["Renderer"] -ne "Running") { throw "The software renderer isn't running: $($states["Renderer"])" }
            if ($states["Window"] -ne "Disabled") { throw "Expected no window (Disabled), got: $($states["Window"])" }

            # A frame: FrameData (0x02) is width, height (uint32), then width * height RGBA pixels, alpha 255
            $width = 64
            $height = 48
            Send-Frame $stream 0x02 ([byte[]]([BitConverter]::GetBytes([int32]$width) + [BitConverter]::GetBytes([int32]$height))) # SetViewportSize
            Assert-Response (Read-Response $stream) 0x00 "SetViewportSize"
            Send-Frame $stream 0x01 # RenderFrame
            $response = Read-Response $stream
            Assert-Response $response 0x02 "RenderFrame"
            $payload = $response.Payload
            if ($payload.Length -ne 8 + $width * $height * 4) { throw "RenderFrame: $($payload.Length) bytes, expected $(8 + $width * $height * 4)" }
            $frameWidth = [BitConverter]::ToUInt32($payload, 0)
            $frameHeight = [BitConverter]::ToUInt32($payload, 4)
            if ($frameWidth -ne $width -or $frameHeight -ne $height) { throw "RenderFrame: a ${frameWidth}x$frameHeight frame, expected ${width}x$height" }
            for ($i = 8 + 3; $i -lt $payload.Length; $i += 4) {
              if ($payload[$i] -ne 255) { throw "RenderFrame: pixel $(($i - 11) / 4) has alpha $($payload[$i])" }
            }
            Write-Host "RenderFrame: ${frameWidth}x$frameHeight, $($payload.Length - 8) bytes of pixels"

            # Headless audio runs on an OpenAL loopback device (no sound card needed), so GetAudio answers
            # with AudioSamples: sampleRate, channels, sampleFormat (string), frameCount, droppedFrames, samples
            Send-Frame $stream 0x03 # GetAudio
            $response = Read-Response $stream
            Assert-Response $response 0x0A "GetAudio"
            $payload = $response.Payload
            $rate = [BitConverter]::ToUInt32($payload, 0)
            $channels = [BitConverter]::ToUInt32($payload, 4)
            $formatLength = [BitConverter]::ToUInt32($payload, 8)
            $format = [Text.Encoding]::ASCII.GetString($payload, 12, $formatLength)
            $frames = [BitConverter]::ToUInt32($payload, 12 + $formatLength)
            if ($rate -ne 48000 -or $channels -ne 2) { throw "Unexpected audio format: $rate Hz, $channels channels" }
            Write-Host "GetAudio: $rate Hz, $channels channels, $format, $frames frames"

            # The startup scene is open: GetOpenScene (0x29). An entity (CreateEntity, 0x30) leaves it unsaved;
            # SaveSceneToFile (0x26) with an empty path writes it to its own file; OpenScene (0x25) reads it back
            $opened = Get-SceneInfo (& { Send-Frame $stream 0x29; Read-Response $stream }) "GetOpenScene"
            if ($opened.Path -ne "res://scenes/Main.scene" -or $opened.Revision -ne $opened.SavedRevision) { throw "The startup scene isn't open, or opened unsaved" }
            Send-Frame $stream 0x30 (Get-StringBytes "Smoke Box")
            Assert-Response (Read-Response $stream) 0x06 "CreateEntity"
            $edited = Get-SceneInfo (& { Send-Frame $stream 0x29; Read-Response $stream }) "GetOpenScene after CreateEntity"
            if ($edited.Revision -eq $edited.SavedRevision) { throw "CreateEntity left the scene saved" }
            $saved = Get-SceneInfo (& { Send-Frame $stream 0x26 (Get-StringBytes ""); Read-Response $stream }) "SaveSceneToFile"
            if ($saved.Revision -ne $saved.SavedRevision -or $saved.Uuid -ne $opened.Uuid) { throw "SaveSceneToFile didn't save the scene" }
            if (-not (Get-Content (Join-Path $project "assets/scenes/Main.scene") -Raw).Contains("Smoke Box")) { throw "Main.scene doesn't hold the saved entity" }
            $reopened = Get-SceneInfo (& { Send-Frame $stream 0x25 (Get-StringBytes "res://scenes/Main.scene"); Read-Response $stream }) "OpenScene"
            if ($reopened.Uuid -ne $opened.Uuid) { throw "OpenScene gave the scene another UUID" }
            Send-Frame $stream 0x34 # GetAllEntities: count, then (id, name) strings
            $response = Read-Response $stream
            Assert-Response $response 0x05 "GetAllEntities"
            if (-not [Text.Encoding]::UTF8.GetString($response.Payload).Contains("Smoke Box")) { throw "The reopened scene lost its entity" }
            # A frame of the reopened scene, on the software renderer
            Send-Frame $stream 0x01
            Assert-Response (Read-Response $stream) 0x02 "RenderFrame after OpenScene"

            # The hierarchy. GetHierarchy (0x28) answers Hierarchy (0x0F): the revision (uint32), then the nodes as json.
            # CreateEntityEx (0x35): name, parentId (strings), siblingIndex (int32), preset (string), answers
            # EntityCreated (0x06): the id. DuplicateEntity (0x38): an id. GetEntity (0x39): an id; EntityData (0x10)
            # answers the entity as json, then its world matrix (16 float32).
            function Get-Hierarchy {
              Send-Frame $stream 0x28
              $response = Read-Response $stream
              Assert-Response $response 0x0F "GetHierarchy"
              $offset = 4
              $nodes = @((Read-WireString $response.Payload ([ref]$offset)) | ConvertFrom-Json)
              return @{ Revision = [BitConverter]::ToUInt32($response.Payload, 0); Nodes = $nodes; Names = @($nodes | ForEach-Object { $_.name }) }
            }
            function New-Entity([string]$name, [string]$parentId, [int]$siblingIndex, [string]$preset) {
              Send-Frame $stream 0x35 ([byte[]]((Get-StringBytes $name) + (Get-StringBytes $parentId) + [BitConverter]::GetBytes([int32]$siblingIndex) + (Get-StringBytes $preset)))
              $response = Read-Response $stream
              Assert-Response $response 0x06 "CreateEntityEx $preset"
              $offset = 0
              return (Read-WireString $response.Payload ([ref]$offset))
            }

            $hierarchyBefore = Get-Hierarchy
            if ($hierarchyBefore.Names -notcontains "Smoke Box") { throw "GetHierarchy: the reopened scene lost its entity: $($hierarchyBefore.Names -join ', ')" }
            $cubeId = New-Entity "Smoke Cube" "" -1 "Cube"
            $lampId = New-Entity "Smoke Lamp" $cubeId -1 "PointLight"
            $hierarchy = Get-Hierarchy
            $cubeIndex = [array]::IndexOf($hierarchy.Names, "Smoke Cube")
            if ($cubeIndex -lt 0 -or $hierarchy.Names[$cubeIndex + 1] -ne "Smoke Lamp") { throw "GetHierarchy: the lamp doesn't follow its parent: $($hierarchy.Names -join ', ')" }
            $lampNode = $hierarchy.Nodes[$cubeIndex + 1]
            if ($lampNode.id -ne $lampId -or $lampNode.parentId -ne $cubeId -or @($lampNode.components)[0] -ne "Light") { throw "GetHierarchy: the lamp's node is wrong" }
            if ($hierarchy.Revision -le $hierarchyBefore.Revision) { throw "GetHierarchy: the revision didn't move with CreateEntityEx" }

            # A duplicate takes its subtree along, and is named after the original
            Send-Frame $stream 0x38 (Get-StringBytes $cubeId)
            Assert-Response (Read-Response $stream) 0x06 "DuplicateEntity"
            $duplicated = Get-Hierarchy
            if ($duplicated.Names -notcontains "Smoke Cube (1)" -or @($duplicated.Names | Where-Object { $_ -eq "Smoke Lamp" }).Count -ne 2) { throw "DuplicateEntity: $($duplicated.Names -join ', ')" }

            Send-Frame $stream 0x39 (Get-StringBytes $cubeId)
            $response = Read-Response $stream
            Assert-Response $response 0x10 "GetEntity"
            $offset = 0
            $entity = (Read-WireString $response.Payload ([ref]$offset)) | ConvertFrom-Json
            if ($entity.header.name -ne "Smoke Cube" -or @($entity.components)[0].type -ne "CubeRenderer" -or $null -eq $entity.transform) { throw "GetEntity: the cube isn't what CreateEntityEx made" }
            if ($response.Payload.Length - $offset -ne 64) { throw "GetEntity: $($response.Payload.Length - $offset) bytes of world matrix, expected 64" }
            # Column-major: a new object at the origin has the identity, so element 15 (and the diagonal) is 1
            foreach ($element in 0, 5, 10, 15) {
              if ([BitConverter]::ToSingle($response.Payload, $offset + 4 * $element) -ne 1.0) { throw "GetEntity: world matrix element $element isn't 1" }
            }
            Write-Host "Hierarchy: $($duplicated.Names -join ', ')"

            # sceneChanged says which objects changed (and the editor viewport still renders)
            Send-Frame $stream 0x05 ([byte[]]([BitConverter]::GetBytes([uint32]$pollEpoch) + [BitConverter]::GetBytes([uint32]$pollNextSeq) + [BitConverter]::GetBytes([uint32]1024)))
            $response = Read-Response $stream
            Assert-Response $response 0x0C "PollEvents after the hierarchy edits"
            $eventsText = [Text.Encoding]::UTF8.GetString($response.Payload, 12, $response.Payload.Length - 12)
            if (-not $eventsText.Contains('"entityIds"') -or -not $eventsText.Contains($cubeId)) { throw "PollEvents: no sceneChanged with the cube's id in entityIds" }
            Send-Frame $stream 0x01
            Assert-Response (Read-Response $stream) 0x02 "RenderFrame with a cube and a light"

            # GetProjectInfo (0x70): rootPath, userDataPath (strings), then project.n2proj as JSON
            Send-Frame $stream 0x70
            $response = Read-Response $stream
            Assert-Response $response 0x0E "GetProjectInfo"
            $offset = 0
            $rootPath = Read-WireString $response.Payload ([ref]$offset)
            $userDataPath = Read-WireString $response.Payload ([ref]$offset)
            $projectJson = (Read-WireString $response.Payload ([ref]$offset)) | ConvertFrom-Json
            if ($projectJson.projectId -ne $projectId) { throw "GetProjectInfo: projectId $($projectJson.projectId), expected $projectId" }
            if (-not $userDataPath.EndsWith("Smoke_Project-$($projectId.Substring(0, 8))")) { throw "GetProjectInfo: user:// isn't the project's own folder: $userDataPath" }
            Write-Host "GetProjectInfo: $rootPath, user:// at $userDataPath"

            # --project initialised the ResourceLoader: the startup asset has metadata, and an asset added
            # afterwards gets its own on RescanAssets
            Assert-Meta "startup.mat"
            Set-Content (Join-Path $project "assets/added.mat") "{}"
            Send-Frame $stream 0x41 # RescanAssets
            Assert-Response (Read-Response $stream) 0x00 "RescanAssets"
            Assert-Meta "added.mat"

            Send-Frame $stream 0xFF # Shutdown
            Assert-Response (Read-Response $stream) 0x00 "Shutdown"
            $client.Close()

            if (-not $proc.WaitForExit(30000)) { throw "Editor host did not exit within 30s of Shutdown" }
            if ($proc.ExitCode -ne 0) { throw ("Editor host exited with code 0x{0:X8}" -f $proc.ExitCode) }
            Write-Host "Editor host exited cleanly"

            $log = Get-Content $logPath -Raw
            foreach ($problem in "Assets directory not found", "ResourceUUID not initialized", "Couldn't open the startup scene") {
              if ($log.Contains($problem)) { throw "Host log reports: $problem" }
            }
            if ($log.Contains($token)) { throw "The host logged its access token" }

            # ---- Host 2: the default renderer (no GPU here, so no window), --exit-on-disconnect, no token ----
            $proc2 = Start-Process -FilePath $exe -PassThru -ArgumentList "--port", "0", "--exit-on-disconnect" `
              -RedirectStandardOutput $logPath2 -RedirectStandardError $errPath2
            $null = $proc2.Handle
            $port = Wait-ReadyLine $proc2 $logPath2

            $client = Connect-Host $port
            $stream = $client.GetStream()
            Send-Frame $stream 0x04 (Get-HelloPayload "")
            Assert-Response (Read-Response $stream) 0x0B "Hello without a token"
            Send-Frame $stream 0x50 # GetEngineHealth
            Assert-Response (Read-Response $stream) 0x09 "GetEngineHealth"
            # Leaving without Shutdown: the session ends, so the host stops by itself
            $client.Close()

            if (-not $proc2.WaitForExit(30000)) { throw "Editor host with --exit-on-disconnect did not exit within 30s of its client leaving" }
            if ($proc2.ExitCode -ne 0) { throw ("Editor host with --exit-on-disconnect exited with code 0x{0:X8}" -f $proc2.ExitCode) }
            Write-Host "Editor host with --exit-on-disconnect exited cleanly when its client left"

            # ---- --exit-on-stdin-eof, on a real pipe: running while stdin is open, gone once it closes ----
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new($exe.Path)
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardInput = $true
            foreach ($argument in "--port", "0", "--exit-on-stdin-eof") { $startInfo.ArgumentList.Add($argument) }
            $procPipe = [System.Diagnostics.Process]::Start($startInfo)
            $null = $procPipe.Handle
            Start-Sleep -Seconds 5
            if ($procPipe.HasExited) { throw ("Editor host with --exit-on-stdin-eof exited while its stdin was still open (code 0x{0:X8})" -f $procPipe.ExitCode) }
            $procPipe.StandardInput.Close()
            if (-not $procPipe.WaitForExit(30000)) { throw "Editor host with --exit-on-stdin-eof did not exit within 30s of its stdin closing" }
            if ($procPipe.ExitCode -ne 0) { throw ("Editor host with --exit-on-stdin-eof exited with code 0x{0:X8}" -f $procPipe.ExitCode) }
            Write-Host "Editor host with --exit-on-stdin-eof exited cleanly when its stdin pipe closed"

            # ---- --exit-on-stdin-eof, stdin already at end of file (an empty file) ----
            $procEof = Start-Process -FilePath $exe -PassThru -ArgumentList "--port", "0", "--exit-on-stdin-eof" `
              -RedirectStandardInput $emptyStdin -RedirectStandardOutput $logPathEof -RedirectStandardError $errPathEof
            $null = $procEof.Handle
            if (-not $procEof.WaitForExit(30000)) { throw "Editor host with --exit-on-stdin-eof did not exit within 30s with its stdin at end of file" }
            if ($procEof.ExitCode -ne 0) { throw ("Editor host with --exit-on-stdin-eof (stdin at end of file) exited with code 0x{0:X8}" -f $procEof.ExitCode) }
            Write-Host "Editor host with --exit-on-stdin-eof exited cleanly with its stdin at end of file"
            # The Logger writes to the console in Debug builds only
            if ($env:N2_SMOKE_CONFIG -eq "Debug" -and -not (Get-Content $logPathEof -Raw).Contains("Stdin closed")) {
              throw "The host's log doesn't say its stdin closed"
            }

            # ---- Without the flag, the same stdin changes nothing: the host keeps serving ----
            $procNoFlag = Start-Process -FilePath $exe -PassThru -ArgumentList "--port", "0" `
              -RedirectStandardInput $emptyStdin -RedirectStandardOutput $logPathNoFlag -RedirectStandardError $errPathNoFlag
            $null = $procNoFlag.Handle
            $null = Wait-ReadyLine $procNoFlag $logPathNoFlag
            Start-Sleep -Seconds 3
            if ($procNoFlag.HasExited) { throw ("Editor host without --exit-on-stdin-eof exited when its stdin was at end of file (code 0x{0:X8})" -f $procNoFlag.ExitCode) }
            Write-Host "Editor host without --exit-on-stdin-eof kept running with its stdin at end of file"
            if ((Get-Content $logPathNoFlag -Raw).Contains("Stdin closed")) { throw "A host without --exit-on-stdin-eof logged that its stdin closed" }
          }
          finally {
            # A failing Kill (the host exiting meanwhile) must not replace the error that got us here
            foreach ($p in $proc, $proc2, $procPipe, $procEof, $procNoFlag) {
              try { if ($p -and -not $p.HasExited) { $p.Kill() } }
              catch { Write-Host "Couldn't kill host process $($p.Id): $($_.Exception.Message)" }
            }
            Write-Host "----- host stdout -----"; Get-Content $logPath -ErrorAction SilentlyContinue
            Write-Host "----- host stderr -----"; Get-Content $errPath -ErrorAction SilentlyContinue
            Write-Host "----- host (--exit-on-disconnect) stdout -----"; Get-Content $logPath2 -ErrorAction SilentlyContinue
            Write-Host "----- host (--exit-on-disconnect) stderr -----"; Get-Content $errPath2 -ErrorAction SilentlyContinue
            Write-Host "----- host (--exit-on-stdin-eof, empty stdin) stdout -----"; Get-Content $logPathEof -ErrorAction SilentlyContinue
            Write-Host "----- host (--exit-on-stdin-eof, empty stdin) stderr -----"; Get-Content $errPathEof -ErrorAction SilentlyContinue
            Write-Host "----- host (no stdin flag) stdout -----"; Get-Content $logPathNoFlag -ErrorAction SilentlyContinue
            Write-Host "----- host (no stdin flag) stderr -----"; Get-Content $errPathNoFlag -ErrorAction SilentlyContinue
          }

      # The real host with --tls (the TLS leg only; the unit tests cover the handshake and the gate): it makes its
      # certificate in the user's data folder, prints it in the ready line, and a client that checks that fingerprint
      # finishes a handshake, says Hello and gets ServerInfo. --exit-on-disconnect ends the host when the client leaves.
      - name: Editor host TLS smoke test
        if: matrix.tls == 'ON'
        shell: pwsh
        env:
          N2_SMOKE_CONFIG: ${{ matrix.config }}
        run: |
          $exe = Resolve-Path "build/bin/$env:N2_SMOKE_CONFIG/N2EditorHost.exe"
          $protocolVersion = (Get-Content editor-server/protocol/protocol.json -Raw | ConvertFrom-Json).version
          $out = Join-Path $env:RUNNER_TEMP "tls-host.out"
          $err = Join-Path $env:RUNNER_TEMP "tls-host.err"
          $proc = Start-Process -FilePath $exe -PassThru -ArgumentList "--tls", "--port", "0", "--renderer", "software", "--exit-on-disconnect" `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $null = $proc.Handle

          # The ready line, as a launcher reads it: port, tls=1 and the certificate's SHA-256 as 64 lowercase hex digits
          $port = $null
          $fingerprint = $null
          $text = ""
          for ($i = 0; $i -lt 240 -and -not $port; $i++) {
            try {
              $file = [System.IO.File]::Open($out, 'Open', 'Read', 'ReadWrite')
              try { $text = [System.IO.StreamReader]::new($file).ReadToEnd() } finally { $file.Dispose() }
            } catch { }
            foreach ($line in ($text -split "`n")) {
              if ($line.TrimEnd("`r") -match '^N2EditorHost ready port=(\d+) tls=1 fingerprint=([0-9a-f]{64})$') { $port = [int]$Matches[1]; $fingerprint = $Matches[2]; break }
            }
            if (-not $port) {
              if ($proc.HasExited) { Get-Content $err -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "stderr: $_" }; throw "The --tls host exited (code $($proc.ExitCode)) before its ready line" }
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $port) { Write-Host $text; throw "The --tls host never printed a ready line with tls=1 and a fingerprint" }
          Write-Host "TLS host ready on port $port, fingerprint $fingerprint"

          # The certificate and key live in the user's data folder, not in the project or the repository
          $identity = Join-Path $env:APPDATA "N2Engine/editor-tls"
          foreach ($name in "host-cert.pem", "host-key.pem") {
            if (-not (Test-Path (Join-Path $identity $name))) { throw "No $name in $identity" }
          }
          if ((Get-Content (Join-Path $identity "host-cert.pem") -Raw) -match "PRIVATE KEY") { throw "The certificate file holds a private key" }

          # Accept any certificate in the handshake, then pin by comparing the fingerprint ourselves: the same trust-on-first-use
          # check a client makes (a compiled callback, as a script block can't run on the TLS thread)
          Add-Type -TypeDefinition 'public static class N2AcceptAnyCertificate { public static bool Check(object sender, System.Security.Cryptography.X509Certificates.X509Certificate certificate, System.Security.Cryptography.X509Certificates.X509Chain chain, System.Net.Security.SslPolicyErrors errors) { return true; } }'
          $callback = [System.Delegate]::CreateDelegate([System.Net.Security.RemoteCertificateValidationCallback], [N2AcceptAnyCertificate].GetMethod('Check'))
          $client = [System.Net.Sockets.TcpClient]::new("127.0.0.1", $port)
          $client.ReceiveTimeout = 20000
          $ssl = [System.Net.Security.SslStream]::new($client.GetStream(), $false, $callback)
          $ssl.AuthenticateAsClient("n2-editor-host")
          $seen = [System.BitConverter]::ToString([System.Security.Cryptography.SHA256]::HashData($ssl.RemoteCertificate.GetRawCertData())).Replace("-", "").ToLowerInvariant()
          if ($seen -ne $fingerprint) { throw "The certificate the host presented ($seen) is not the one its ready line named ($fingerprint)" }
          Write-Host "Handshake done ($($ssl.SslProtocol)); the fingerprint matches the ready line"

          # Hello (0x04): clientName, protocolVersion, token as [uint32 byte count][UTF-8]; ServerInfo is 0x0B
          function Get-StringBytes([string]$value) {
            $utf8 = [Text.Encoding]::UTF8.GetBytes($value)
            return ,[byte[]]([BitConverter]::GetBytes([uint32]$utf8.Length) + $utf8)
          }
          $payload = [byte[]]((Get-StringBytes "CI TLS smoke test") + (Get-StringBytes $protocolVersion) + (Get-StringBytes ""))
          $request = [byte[]](@([byte]0x04) + [BitConverter]::GetBytes([uint32]$payload.Length) + $payload)
          $ssl.Write($request, 0, $request.Length)
          $ssl.Flush()
          $header = New-Object byte[] 5
          $offset = 0
          while ($offset -lt 5) {
            $read = $ssl.Read($header, $offset, 5 - $offset)
            if ($read -le 0) { throw "The TLS connection closed before Hello was answered" }
            $offset += $read
          }
          if ($header[0] -ne 0x0B) { throw ("Hello over TLS: expected ServerInfo (0x0B), got 0x{0:X2}" -f $header[0]) }
          Write-Host "Hello over TLS answered with ServerInfo"

          $ssl.Dispose()
          $client.Close()
          if (-not $proc.WaitForExit(30000)) { throw "The --tls host did not exit within 30s of its client leaving" }
          if ($proc.ExitCode -ne 0) { throw ("The --tls host exited with code 0x{0:X8}" -f $proc.ExitCode) }
          Write-Host "The --tls host exited cleanly when its client left"

      # What the Electron editor does for play mode, with the real binary on the software renderer (see the script's
      # header): an edit host writes a play snapshot (WritePlaySnapshot) of its unsaved scene, a second process
      # (N2EditorHost --play <snapshot> with the same --project and --renderer) plays it, and the test checks the script
      # ran, frames advance beside a busy client, pause, step, input, RenderFrame and Shutdown, that the edit host and its
      # scene file are untouched, and that --exit-on-disconnect and a missing snapshot end the child as documented.
      - name: Play child smoke test
        shell: pwsh
        env:
          N2_SMOKE_CONFIG: ${{ matrix.config }}
        run: ./tests/editor-server/PlaySmokeTest.ps1 -Config $env:N2_SMOKE_CONFIG

  # The Linux build: the engine, renderer, editor host and unit tests on Clang 18 with libstdc++ 14 (both ship with
  # ubuntu-24.04). Not GCC: sol2 names its function-object metatables from __PRETTY_FUNCTION__, where GCC prints every
  # lambda of one signature in one function as the same "<lambda(int)>", so the Lua bindings call each other's lambdas
  # (Layers.MaskOf ran LayerToName); Clang names a lambda by its source location. PhysX is OFF (no Linux binaries yet); FreeType, ufbx
  # and TLS are ON so the optional backends compile here too. The host smoke test is a later change.
  linux:
    name: linux (Release, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 g++-14 cmake ninja-build python3 \
            libvulkan-dev libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libasound2-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DN2ENGINE_BUILD_TESTS=ON -DN2ENGINE_USE_PHYSX=OFF -DN2ENGINE_EDITOR_TLS=ON -DN2ENGINE_TEXT_FREETYPE=ON -DN2ENGINE_MODEL_UFBX=ON

      - name: Build
        run: cmake --build build --parallel --target N2EditorHost math_tests text_tests assetimport_tests engine_tests renderer_tests editor_server_tests editor_project_tests -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          # Silent OpenAL output device; the runner has no sound card
          ALSOFT_DRIVERS: "null"

          PYTHONDONTWRITEBYTECODE: "1"

      # The physics determinism corpus (stage J7): ten scenes on Jolt, 600 ticks each, hashed every 60 ticks; the hashes are
      # written to determinism-hashes.json and uploaded for the `determinism` job, which compares every leg with the others and
      # with tests/golden/physics-determinism.json. ctest ran the same tests above (what they assert concerns this binary
      # alone); this run is the one that writes the file. A failed corpus test fails this leg, and the file is uploaded anyway.

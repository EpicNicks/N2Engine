name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true
          stripdown: true

      - name: Cache PhysX binaries
        uses: actions/cache@v4
        with:
          path: external/PhysX/physx/bin
          key: physx-bin-${{ runner.os }}-v1

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DN2ENGINE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
        env:
          # Silent OpenAL output device; the runner has no sound card
          ALSOFT_DRIVERS: "null"

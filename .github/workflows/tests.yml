        with:
          name: determinism-hashes-linux-x86_64-gcc
          path: determinism-hashes.json
          if-no-files-found: warn
          retention-days: 30

      # The golden replay corpus (netcode C2): three physics-free scenes (transforms, a Lua sim script, Lua-steered transforms)
      # replayed from the input logs of tests/golden/replays, 600 ticks each, hashed every 60 ticks; the hashes are written to
      # replay-hashes.json and uploaded for the `golden-replay` job, which compares every leg with the others and with
      # tests/golden/replay-determinism.json. ctest ran the same tests above; this run is the one that writes the file.
      - name: Golden replay hashes
        if: ${{ !cancelled() }}
        run: ./build/bin/engine_tests --gtest_filter='GoldenReplayCorpusTest.*'
        env:
          ALSOFT_DRIVERS: "null"
          N2_REPLAY_LEG: linux-x86_64-gcc
          N2_REPLAY_HASHES_OUT: ${{ github.workspace }}/replay-hashes.json

      - name: Upload the replay hashes
        if: "!cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: replay-hashes-linux-x86_64-gcc
          path: replay-hashes.json
          if-no-files-found: warn
          retention-days: 30

      # Runs after a failed build or test too (not when cancelled): the hit rate of this run, from zeroed statistics
      - name: ccache statistics
        if: "!cancelled()"
        continue-on-error: true
        run: |
          {
            echo "### ccache (linux-x86_64-gcc14)"
            echo "restored cache: ${{ steps.ccache-restore.outputs.cache-matched-key || 'none (cold build)' }}"
            echo '```'
            ccache -s
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ccache -s

      # Only a push to master saves (never a pull request, never workflow_dispatch); master runs are never cancelled, so a
      # partial cache from a cancelled run cannot be saved. Entries are immutable, so the key carries the run id.
      - name: Save ccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-linux-x86_64-gcc14-${{ github.run_id }}-${{ github.run_attempt }}

  # The container image (deploy/Dockerfile) on x86_64: builds it exactly as the Linux Clang job builds the host, checks the
  # runtime image has every shared library (the Dockerfile's ldd step), makes a project in a volume, starts the container
  # as its non-root user waits for the TLS ready line and checks that the host reports physics Running (PhysX is linked in statically). Not a required check. arm64 images are not built in CI.
  docker:
    name: docker (editor host image, x86_64)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -f deploy/Dockerfile -t n2editorhost .

      # The image carries Jolt and the strict floating-point profile (N2ENGINE_DETERMINISTIC, the Dockerfile's default):
      # the host binary's and the image's sizes, in the log and the job summary
      - name: Report the image size
        run: |
          set -eu
          host=$(docker run --rm --entrypoint stat n2editorhost -c %s /usr/local/bin/N2EditorHost)
          image=$(docker image inspect -f '{{.Size}}' n2editorhost)
          echo "N2EditorHost: $host bytes; image: $image bytes"
          { echo "docker (N2ENGINE_DETERMINISTIC=ON): N2EditorHost $host bytes, image $image bytes"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the host in the container
        run: |
          set -eu
          docker volume create n2proj
          docker run --rm -v n2proj:/project n2editorhost --create /project
          docker run -d --name n2host -e N2_EDITOR_TOKEN=ci-only-token -v n2proj:/project -p 127.0.0.1:9999:9999 n2editorhost
          for i in $(seq 1 60); do
            if docker logs n2host 2>&1 | grep -Eq 'N2EditorHost ready port=9999 tls=1 fingerprint=[0-9a-f]{64}'; then
              echo "ready"; docker exec n2host id -u
              # The host in the image has PhysX: its health must report physics Running (over the --tls port, with the token)
              N2_ATTACH_TOKEN=ci-only-token PYTHONDONTWRITEBYTECODE=1 python3 tests/smoke/editor_host_smoke.py --scenario attach --port 9999 --tls --token-env N2_ATTACH_TOKEN --expect-physics on
              # The Release host's log lines reach stderr, so `docker logs` has them: one timestamped line for the Hello just made
              # (the line is written before the Hello is answered), and nothing of the token in any line
              docker logs n2host > host.log 2>&1
              grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z (INFO|WARN) Editor client .* said Hello .* user=token role=admin peer=' host.log || { cat host.log; echo "no timestamped Hello line in docker logs"; exit 1; }
              if grep -q 'ci-only-token' host.log; then cat host.log; echo "the token reached docker logs"; exit 1; fi
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' n2host)" != "true" ]; then break; fi
            sleep 1
          done
          docker logs n2host
          exit 1

      # The tokens-file mode of docs/editor.html#exposed-host: --new-token in the container, the file bind-mounted read-only
      # and owned by the container user (uid 10001) with mode 0400 (the default secret mode, 0444, must be refused), a
      # Hello with the token, and a revocation (the file rewritten in place, the token then refused on the next connection; SIGHUP is not exercised).
      # Docker secrets and systemd are not run here.
      - name: Run the host in the container with a tokens file
        run: |
          set -eu
          docker rm -f n2host
          made="$(docker run --rm n2editorhost --new-token alice admin)"
          token="$(printf '%s\n' "$made" | sed -n 's/^token: //p')"
          entry="$(printf '%s\n' "$made" | grep '^{"user"')"
          test -n "$token" && test -n "$entry"
          mkdir tokens
          printf '[\n%s\n]\n' "$entry" > tokens/tokens.json
          sudo chown 10001:10001 tokens/tokens.json
          sudo chmod 0444 tokens/tokens.json
          # 0444: the host must refuse it and the container must exit non-zero
          if docker run --rm -v "$PWD/tokens/tokens.json:/run/secrets/n2_tokens:ro" -v n2proj:/project n2editorhost                --bind 0.0.0.0 --port 9999 --project /project --renderer software --tls --tokens-file /run/secrets/n2_tokens > refused.log 2>&1; then
            cat refused.log; echo "a 0444 tokens file was accepted"; exit 1
          fi
          cat refused.log
          grep -q 'accessible to its group or to others' refused.log
          sudo chmod 0400 tokens/tokens.json
          docker run -d --name n2tokens -v "$PWD/tokens/tokens.json:/run/secrets/n2_tokens:ro" -v n2proj:/project -p 127.0.0.1:9998:9999 n2editorhost             --bind 0.0.0.0 --port 9999 --project /project --renderer software --tls --tokens-file /run/secrets/n2_tokens
          for i in $(seq 1 60); do
            if docker logs n2tokens 2>&1 | grep -Eq 'N2EditorHost ready port=9999 tls=1 fingerprint=[0-9a-f]{64}'; then
              # Hello with alice's token (matched across the file's entries; no --token-env involved in the host)
              N2_ATTACH_TOKEN="$token" PYTHONDONTWRITEBYTECODE=1 python3 tests/smoke/editor_host_smoke.py --scenario attach --port 9998 --tls --token-env N2_ATTACH_TOKEN --expect-physics on
              N2_ATTACH_TOKEN="$token" PYTHONDONTWRITEBYTECODE=1 python3 tests/smoke/editor_host_smoke.py --scenario attach --port 9998 --tls --token-env N2_ATTACH_TOKEN --expect-physics on
              # Revoke everyone by rewriting the file in place (a bind-mounted single file keeps its inode); the next connection re-stats the file and refuses the token. SIGHUP is not tested: the host is PID 1 here, and the kernel drops a signal without a handler
              sudo sh -c 'printf "\n[]\n" > tokens/tokens.json'
              if N2_ATTACH_TOKEN="$token" PYTHONDONTWRITEBYTECODE=1 python3 tests/smoke/editor_host_smoke.py --scenario attach --port 9998 --tls --token-env N2_ATTACH_TOKEN > revoked.log 2>&1; then
                cat revoked.log; echo "a revoked token was accepted"; exit 1
              fi
              cat revoked.log
              grep -q 'SMOKE TEST FAILED: .*Hello' revoked.log
              # The refusal and the reload are in `docker logs` (stderr), and neither the token nor its hash is
              hash="$(printf '%s' "$entry" | sed -n 's/.*sha256:\([0-9a-f]*\).*/\1/p')"
              test -n "$hash"
              for j in $(seq 1 10); do
                docker logs n2tokens > tokens-host.log 2>&1
                if grep -Eq '^[0-9T:.Z-]+ WARN Refused Hello from editor client .* role=none\): wrong access token peer=' tokens-host.log \
                   && grep -Eq '^[0-9T:.Z-]+ INFO Reloaded the tokens file: 0 user\(s\)' tokens-host.log; then break; fi
                sleep 1
              done
              grep -Eq '^[0-9T:.Z-]+ WARN Refused Hello from editor client .* role=none\): wrong access token peer=' tokens-host.log || { cat tokens-host.log; echo "no refused-Hello line in docker logs"; exit 1; }
              grep -Eq '^[0-9T:.Z-]+ INFO Reloaded the tokens file: 0 user\(s\)' tokens-host.log || { cat tokens-host.log; echo "no reload line in docker logs"; exit 1; }
              if grep -q -e "$token" -e "$hash" tokens-host.log; then cat tokens-host.log; echo "a token or its hash reached docker logs"; exit 1; fi
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' n2tokens)" != "true" ]; then break; fi
            sleep 1
          done
          docker logs n2tokens
          exit 1

  # The web (WebAssembly) build, stages 0 to 5 of issue #155 and WebGPU G4/G5 (emdawnwebgpu, browser selection and presentation;
  # node smokes use software): the math, text and asset-import libraries, the engine
  # core (single-threaded; audio is Emscripten's OpenAL on WebAudio, which node lacks, so the tests see no audio device) and the software renderer, and their unit tests (math, text, assetimport,
  # engine, renderer and web input tests, the software-renderer goldens among them), built with Emscripten and run under
  # node; and the web player package (index.html, js, wasm, the asset pack, the loader and manifest.json), checked and run
  # headless under node in all three profiles (dev, size, speed; stage 3), with the size budgets of web/budgets.json enforced. Not a required check. Emscripten is pinned to an exact release (EMSCRIPTEN_VERSION, installed
  # with the official emsdk, no third-party action): a moving "latest" would let an upstream release break or change the
  # build with no change in this repository. 4.0.10 was chosen as a 4.0 release with a recent LLVM/libc++ for C++23 (not yet proven: the first
  # run of this job is the proof; bump the pin here and in docs/web-build.html if it is not enough). ccache is not used.
  # The unit tests run on the dev profile only; the size and speed profiles build and check the player package (no tests:
  # they would not add coverage, only minutes). The tests that cannot run on the web are excluded by an explicit list (tests/engine/CMakeLists.txt) or
  # skip themselves; docs/web-build.html lists them with their reasons and describes the build.
  web:
    name: web (Emscripten, dev profile, node tests)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EMSCRIPTEN_VERSION: 4.0.10
    steps:
      - uses: actions/checkout@v7

      # emsdk is cloned at the release tag if it has one, otherwise at its default branch; either way `install` fetches
      # exactly EMSCRIPTEN_VERSION (the emsdk repository only says where to download that release from). The emsdk
      # node that comes with it is the one the tests run under.
      - name: Install the Emscripten SDK
        run: |
          set -e
          git clone --depth 1 --branch "$EMSCRIPTEN_VERSION" https://github.com/emscripten-core/emsdk.git "$HOME/emsdk" \
            || git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk activate "$EMSCRIPTEN_VERSION"
          . ./emsdk_env.sh
          emcc --version | head -n 1
          node --version
          cmake --version | head -n 1
          ninja --version

      # Stage 5: PhysX for WebAssembly is compiled from source by the first configure (cmake/PhysXWeb.cmake runs
      # scripts/web-build-physx.sh) into external/PhysX/physx/bin/emscripten.wasm32, which every profile reuses. The cache
      # holds that folder (static libraries, patched headers, licence, stamp), keyed by the PhysX pin, the build recipe
      # and the Emscripten release, so the build runs again only when one of them changes. Saved right after the configure
      # (not at the end of the job) so a failing test run later still leaves the libraries cached.
      - name: Restore the PhysX WebAssembly libraries
        id: physx-web-cache
        uses: actions/cache/restore@v6
        with:
          path: external/PhysX/physx/bin/emscripten.wasm32
          key: physx-web-emsdk-${{ env.EMSCRIPTEN_VERSION }}-${{ hashFiles('cmake/PhysXWebPin.cmake', 'scripts/web-build-physx.sh') }}

      - name: Configure (dev profile)
        run: |
          set -e -o pipefail
          . "$HOME/emsdk/emsdk_env.sh"
          start=$(date +%s)
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DN2ENGINE_WEB_PROFILE=dev -DN2ENGINE_USE_JOLT=ON -DN2ENGINE_STRICT_FP=ON 2>&1 | tee configure-dev.log
          echo "configure took $(( $(date +%s) - start )) s (PhysX cache hit: ${{ steps.physx-web-cache.outputs.cache-hit }})"
          # PhysX failing to build turns it OFF with a warning in every other configuration; on the web that would only
          # skip the physics tests, so the job insists that it is on
          grep -q "PhysX enabled" configure-dev.log
          cat external/PhysX/physx/bin/emscripten.wasm32/.pin
          ls -l external/PhysX/physx/bin/emscripten.wasm32/lib

      - name: Save the PhysX WebAssembly libraries
        if: steps.physx-web-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: external/PhysX/physx/bin/emscripten.wasm32
          key: ${{ steps.physx-web-cache.outputs.cache-primary-key }}

      # Without the tests (only the GLFW and OpenAL headers are fetched): the size and speed profiles build the player
      # package further down
      - name: Configure (size and speed profiles)
        run: |
          set -e -o pipefail
          . "$HOME/emsdk/emsdk_env.sh"
          for profile in size speed; do
            emcmake cmake -S . -B "build-web-$profile" -G Ninja -DCMAKE_BUILD_TYPE=Release -DN2ENGINE_WEB_PROFILE="$profile" -DN2ENGINE_BUILD_TESTS=OFF -DN2ENGINE_USE_JOLT=ON 2>&1 | tee "configure-$profile.log"
            # N2ENGINE_STRICT_FP is ON by default for these two profiles (so Jolt can declare CrossPlatform there)
            grep -q "Strict floating-point profile enabled" "configure-$profile.log"
          done

      - name: Build
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          cmake --build build-web --target math_tests text_tests assetimport_tests engine_tests renderer_tests web_tests jolt_smoke_tests N2WebGpuReadbackTests -- -k 0

      # CMake's Emscripten toolchain sets CMAKE_CROSSCOMPILING_EMULATOR to node, so ctest runs build-web/bin/<name>.js under node
      - name: Test under node
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          ctest --test-dir build-web --output-on-failure -V

      # The Jolt BACKEND under node (single-threaded: the web build has no pthreads): its [JOLT-BACKEND-DETERMINISM] lines in the
      # job's log and summary, to be compared with the native legs'
      - name: Jolt backend determinism numbers
        run: |
          set -e -o pipefail
          . "$HOME/emsdk/emsdk_env.sh"
          node build-web/bin/engine_tests.js --gtest_filter='JoltBackendDeterminismTest.*' | tee jolt-backend.log
          { echo; echo "web (node):"; echo; grep '^\[JOLT-BACKEND-DETERMINISM\]' jolt-backend.log | sed 's/^/    /'; echo; } >> "$GITHUB_STEP_SUMMARY"

      # The physics determinism corpus (stage J7) under node (single-threaded; the dev profile, strict floating point): the same
      # file and artifact as the native legs, compared by the `determinism` job. NODERAWFS makes the file a real one.
      - name: Physics determinism corpus
        if: ${{ !cancelled() }}
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          node build-web/bin/engine_tests.js --gtest_filter='PhysicsDeterminismCorpusTest.*'
        env:
          N2_DETERMINISM_LEG: web-node
          N2_DETERMINISM_HASHES_OUT: ${{ github.workspace }}/determinism-hashes.json

      - name: Upload the determinism hashes
        if: "!cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: determinism-hashes-web-node
          path: determinism-hashes.json
          if-no-files-found: warn
          retention-days: 30

      # The golden replay corpus (netcode C2): three physics-free scenes (transforms, a Lua sim script, Lua-steered transforms)
      # replayed from the input logs of tests/golden/replays, 600 ticks each, hashed every 60 ticks; the hashes are written to
      # replay-hashes.json and uploaded for the `golden-replay` job, which compares every leg with the others and with
      # tests/golden/replay-determinism.json. ctest ran the same tests above. Under node (NODERAWFS makes the file a real one).
      - name: Golden replay hashes
        if: ${{ !cancelled() }}
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          node build-web/bin/engine_tests.js --gtest_filter='GoldenReplayCorpusTest.*'
        env:
          N2_REPLAY_LEG: web-node
          N2_REPLAY_HASHES_OUT: ${{ github.workspace }}/replay-hashes.json

      - name: Upload the replay hashes
        if: "!cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: replay-hashes-web-node
          path: replay-hashes.json
          if-no-files-found: warn
          retention-days: 30

      # Only reports (raw and gzip sizes in the job summary); the budgets are checked on the package below
      - name: Report artifact sizes
        run: bash scripts/web-size-report.sh build-web/bin

      - name: Test browser WebSocket transport against a native listener
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          bash scripts/build-websocket-native-smoke.sh build-web/websocket-native
          cmake --build build-web --target websocket_client -- -k 0
          "$EMSDK_NODE" scripts/websocket-smoke.mjs build-web/websocket-native/websocket_echo
          "$EMSDK_NODE" scripts/websocket-smoke.mjs build-web/websocket-native/websocket_echo build-web/bin/websocket_client.js

      # Stage 2 (issue #155): the web player and its package folder (build-web/web-package: index.html, index.js,
      # index.wasm, index.data, static files only). Linking it also runs the packaging of lua_project's assets.
      - name: Build the web package
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          cmake --build build-web --target web-package -- -k 0

      # Checks the folder's contents (static files only, relative URLs, no worker script) and runs the player headless
      # under node for 30 frames with the canvas mocked: every frame must arrive at the size asked for and show something.
      # This is not a browser: the canvas, the input events and the page itself are checked by hand (docs/web-checklist.html).
      - name: Smoke the web package under node
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          node scripts/web-package-smoke.mjs build-web/web-package 30 320x180

      # The loader (web/n2-loader.js) under node with a mock fetch: right and wrong MIME type (one request), no manifest,
      # a compressing host without a manifest, 404, truncated file, LinkError, a page older than its manifest
      - name: Test the web loader under node
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          node scripts/web-loader-test.mjs
          node scripts/web-gpu-test.mjs
          node --test scripts/web-browser-support.test.mjs

      # Stage 4: the audio unlock of the loader (web/n2-loader.js, createAudioUnlock) under node with a mock AudioContext
      # and a mock document: resume once on the first gesture, listeners removed, failures tolerated, the hidden tab
      - name: Test the web audio unlock under node
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          node scripts/web-audio-unlock-test.mjs

      - name: Report web package sizes
        run: bash scripts/web-size-report.sh build-web/web-package

      # Stage 3: the package's sizes (manifest.json, written by the web-package target) against web/budgets.json, the one
      # place the budgets live. The job fails when one is exceeded.
      - name: Check the web package size budgets (dev)
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          node scripts/web-budget-check.mjs build-web/web-package dev

      # Stage 3: the size and speed profiles, each a full rebuild of the engine, the renderer and the player (LTO, no tests),
      # then the same package smoke (now with the .br/.gz siblings required) and the profile's budgets.
      - name: Build and check the web package (size profile)
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          cmake --build build-web-size --target web-package -- -k 0
          node scripts/web-package-smoke.mjs build-web-size/web-package 30 320x180 --precompressed
          bash scripts/web-size-report.sh build-web-size/web-package
          node scripts/web-budget-check.mjs build-web-size/web-package size

      # Jolt Physics (N2ENGINE_USE_JOLT) IS linked into the player since the Jolt backend (PR #205): the player's budgets were raised
      # for it. Two small programs of its own (cmake/jolt/probe) still give the library's weight in this profile (the .wasm of
      # the probe minus the baseline's), and the probe, which runs the smoke test's scenario, must print the golden state hash
      # (it exits non-zero otherwise)
      - name: Measure Jolt Physics (size profile)
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          cmake --build build-web-size --target jolt_size_baseline jolt_size_probe -- -k 0
          node build-web-size/bin/jolt_size_probe.js
          node scripts/web-jolt-size-report.mjs build-web-size size

      - name: Build and check the web package (speed profile)
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          cmake --build build-web-speed --target web-package -- -k 0
          node scripts/web-package-smoke.mjs build-web-speed/web-package 30 320x180 --precompressed
          bash scripts/web-size-report.sh build-web-speed/web-package
          node scripts/web-budget-check.mjs build-web-speed/web-package speed

      - name: Measure Jolt Physics (speed profile)
        run: |
          set -e
          . "$HOME/emsdk/emsdk_env.sh"
          cmake --build build-web-speed --target jolt_size_baseline jolt_size_probe -- -k 0
          node build-web-speed/bin/jolt_size_probe.js
          node scripts/web-jolt-size-report.mjs build-web-speed speed

      # WebGPU stage G4 (#155): the WebGPU backend is linked into the player of every profile (built against Emscripten's
      # emdawnwebgpu port, cmake/EmdawnwebgpuPort.cmake, which emcc fetches at the first compile). G5 selects it in supporting
      # browsers; the node smokes above run software. The proof that it is linked is the port's JavaScript in
      # index.js: the call that makes a render pipeline on the browser's GPUDevice, which only the backend's pipeline cache reaches
      - name: Check that the WebGPU backend is linked into the player (all profiles)
        run: |
          set -e
          for dir in build-web build-web-size build-web-speed; do
            if ! grep -q 'createRenderPipeline(' "$dir/web-package/index.js"; then
              echo "$dir/web-package/index.js has no WebGPU backend (no createRenderPipeline call)"
              exit 1
            fi
            echo "$dir: the WebGPU backend is linked into the player"
          done

      # G6 reuses these exact build outputs in a separate browser job; no second engine build or mutable artifact ref.
      # The size-profile player keeps the transfer small. The dev readback executable links only the renderer.
      - name: Upload the browser gate inputs
        uses: actions/upload-artifact@v7
        with:
          name: webgpu-browser-inputs
          path: |
            build-web-size/web-package/index.html
            build-web-size/web-package/index.js
            build-web-size/web-package/index.wasm
            build-web-size/web-package/index.data
            build-web-size/web-package/n2-loader.js
            build-web-size/web-package/manifest.json
            build-web/browser-tests/n2-webgpu-readback.js
            build-web/browser-tests/n2-webgpu-readback.wasm
          if-no-files-found: error
          retention-days: 7

  # Optional G6 check (not a branch-protection requirement). Failures stay visible: no continue-on-error.
  # The full browser smoke runs against the package built above on Chromium's SwiftShader WebGPU adapter.
  # Fixed-colour C++ readback goldens are required; counters/screenshots alone cannot prove GPU output.
  webgpu-browser:
    name: webgpu (Chromium, SwiftShader browser)
    needs: [changes, web]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browser-cache
      N2_READBACK_DIR: ${{ github.workspace }}/browser-inputs/build-web/browser-tests
      N2_BROWSER_EVIDENCE_DIR: ${{ github.workspace }}/browser-evidence
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/browser-tools/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: webgpu-browser-inputs
          path: browser-inputs
      - name: Install the pinned browser and tools
        run: |
          npm ci --prefix scripts/browser-tools --ignore-scripts
          node scripts/browser-tools/node_modules/playwright/cli.js install --with-deps --no-shell chromium
          sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Run the SwiftShader browser gate
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          node --test scripts/web-browser-support.test.mjs
          xvfb-run -a node scripts/web-browser-smoke.mjs browser-inputs/build-web-size/web-package scripts/browser-tools --swiftshader --headed 2>&1 | tee browser-evidence/runner.log
      - name: Retain browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: webgpu-browser-evidence
          path: browser-evidence
          if-no-files-found: warn
          retention-days: 14

  # The cross-leg determinism comparison of the Jolt backend (stage J7, docs/physics.html "Determinism proof in CI"). Every leg
  # (windows Release, linux x86_64 Clang, linux arm64 Clang, linux x86_64 GCC 14, web under node) ran the physics scene corpus
  # on a strict floating-point build and uploaded determinism-hashes-<leg>; this job needs all of them, downloads the files and
  # compares them with each other and with tests/golden/physics-determinism.json (scripts/physics-determinism.py). It runs
  # when a leg failed too (a missing or incomplete leg is a finding, never a silent skip), and not on a docs-only pull
  # request. NOT a required check: make it required only after two weeks green (design P9; Settings, Branches, the master
  # rule, add "determinism (cross-leg physics hashes)").
  determinism:
    name: determinism (cross-leg physics hashes)
    needs: [changes, windows, linux, linux-arm64, linux-gcc, web]
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Proves the comparison can fail (a differing record, a missing record, scene or leg, a golden mismatch)
      - name: Self-test the comparison
        run: python3 scripts/physics-determinism.py self-test

      # A leg that uploaded nothing leaves no folder here: the comparison names it as missing
      - name: Download the legs' hashes
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: determinism-hashes-*
          path: determinism-legs

      # What the golden would hold, made from the Linux x86_64 Clang leg: download it from this run and commit it as
      # tests/golden/physics-determinism.json only from a green run, in a pull request that says why (the first run has no
      # golden, so this is how it is created)
      - name: Make the golden candidate
        continue-on-error: true
        run: python3 scripts/physics-determinism.py golden --from determinism-legs/determinism-hashes-linux-x86_64-clang/determinism-hashes.json --out golden-candidate/physics-determinism.json

      - name: Upload the golden candidate
        if: "!cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: physics-determinism-golden-candidate
          path: golden-candidate/physics-determinism.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Compare the legs with each other and with the golden
        run: python3 scripts/physics-determinism.py compare --legs-dir determinism-legs --expect windows-release,linux-x86_64-clang,linux-arm64-clang,linux-x86_64-gcc,web-node --golden tests/golden/physics-determinism.json

  # The cross-leg golden replay comparison (netcode stage C2, docs/testing.html "The golden replay job"). Every leg (windows
  # Release, linux x86_64 Clang, linux arm64 Clang, linux x86_64 GCC 14, web under node) replayed the physics-free scenes of
  # tests/golden/replays on a strict floating-point build and uploaded replay-hashes-<leg>; this job needs all of them,
  # downloads the files and compares them with each other and with tests/golden/replay-determinism.json
  # (scripts/replay-determinism.py). It runs when a leg failed too (a missing or incomplete leg is a finding, never a silent
  # skip), and not on a docs-only pull request. NOT a required check: make it required only after two weeks green (design
  # P9; Settings, Branches, the master rule, add "golden replay (cross-leg hashes)").
  golden-replay:
    name: golden replay (cross-leg hashes)
    needs: [changes, windows, linux, linux-arm64, linux-gcc, web]
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Proves the comparison can fail (a differing record, a missing record, scene or leg, a golden mismatch)
      - name: Self-test the comparison
        run: python3 scripts/replay-determinism.py self-test

      # A leg that uploaded nothing leaves no folder here: the comparison names it as missing
      - name: Download the legs' hashes
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: replay-hashes-*
          path: replay-legs

      # What the golden would hold, made from the Linux x86_64 Clang leg: download it from this run and commit it as
      # tests/golden/replay-determinism.json only from a green run, in a pull request that says why
      - name: Make the golden candidate
        continue-on-error: true
        run: python3 scripts/replay-determinism.py golden --from replay-legs/replay-hashes-linux-x86_64-clang/replay-hashes.json --out golden-candidate/replay-determinism.json

      - name: Upload the golden candidate
        if: "!cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: replay-determinism-golden-candidate
          path: golden-candidate/replay-determinism.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Compare the legs with each other and with the golden
        run: python3 scripts/replay-determinism.py compare --legs-dir replay-legs --expect windows-release,linux-x86_64-clang,linux-arm64-clang,linux-x86_64-gcc,web-node --golden tests/golden/replay-determinism.json

  # WebGPU backend, stages G1/G5 (#155): the built-in WGSL files and the loader's exact canvas shader are validated by Tint (the
  # WGSL compiler of Chrome and Edge) and by naga (Firefox's; Safari's WebKit compiler has no CI path), the pinned versions in scripts/install-wgsl-validators.sh
  # (Tint: Dawn's prebuilt release binary, SHA-256 checked; naga-cli: its crates.io source package, SHA-256 checked, built with
  # --locked). Not a required check, and it follows the docs-only skip like the jobs above. No build of the engine: a few
  # minutes (the Tint download is seconds; a cold cache also installs the pinned Rust toolchain and builds naga, a few minutes, cached keyed on the install script).
  wgsl:
    name: wgsl (Tint, naga)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Restore the validators
        uses: actions/cache@v6
        with:
          path: ~/wgsl-validators
          key: wgsl-validators-${{ runner.os }}-${{ hashFiles('scripts/install-wgsl-validators.sh') }}

      - name: Install Tint and naga (pinned, hash-checked)
        run: bash scripts/install-wgsl-validators.sh "$HOME/wgsl-validators"

      - name: Validate the WGSL shaders
        run: |
          set -e
          export TINT="$HOME/wgsl-validators/tint/bin/tint" NAGA="$HOME/wgsl-validators/naga/bin/naga"
          bash scripts/validate-wgsl.sh

  # WebGPU backend, stage G2 (#155): the native test harness. The WebGPU renderer (renderer/src/webgpu/, built only with
  # N2ENGINE_RENDERER_WEBGPU=ON, never selectable at run time) runs on the pinned prebuilt Dawn (cmake/DawnPrebuilt.cmake, the
  # same release the "wgsl" job takes Tint from) over Mesa lavapipe, the CPU Vulkan driver the Linux legs use. Builds the renderer
  # and the webgpu_tests program only (not the engine). Not a required check, and it follows the docs-only skip like the jobs above.
  # No existing job changes: the option is OFF everywhere else. Cost: see docs/application.html#webgpu-backend (CI).
  webgpu:
    name: webgpu (Dawn, lavapipe)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc-14
      CXX: g++-14
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
    steps:
      - uses: actions/checkout@v7

      # The renderer's Dawn and the shader validators' Tint must be one revision: the two pins name the same Dawn release. So
      # must the web build's emdawnwebgpu (stage G4: cmake/EmdawnwebgpuPort.cmake), so that both builds compile the backend
      # against the same webgpu.h
      - name: Dawn, Tint and emdawnwebgpu pins agree
        run: |
          set -eu
          cmake_pin() { sed -n "s/^set($1 \"\(.*\)\")\$/\1/p" cmake/DawnPrebuilt.cmake; }
          script_pin() { sed -n "s/^$1=\"\(.*\)\"\$/\1/p" scripts/install-wgsl-validators.sh; }
          for pair in N2_DAWN_TAG:DAWN_TAG N2_DAWN_COMMIT:DAWN_COMMIT N2_DAWN_SHA256:DAWN_SHA256; do
            a=$(cmake_pin "${pair%%:*}")
            b=$(script_pin "${pair##*:}")
            echo "${pair%%:*} = $a ; ${pair##*:} = $b"
            test -n "$a"
            test "$a" = "$b"
          done
          web_tag=$(sed -n "s/^set(N2_EMDAWNWEBGPU_TAG \"\(.*\)\")\$/\1/p" cmake/EmdawnwebgpuPort.cmake)
          echo "N2_EMDAWNWEBGPU_TAG = $web_tag"
          test "$web_tag" = "$(cmake_pin N2_DAWN_TAG)"

      # Dawn's Vulkan backend needs a Vulkan loader and a driver at run time, not the headers: libvulkan1 and Mesa lavapipe
      # (mesa-vulkan-drivers). The Vulkan renderer is compiled out of this job (N2ENGINE_RENDERER_VULKAN=OFF), so no libvulkan-dev.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 g++-14 cmake ninja-build python3 libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libasound2-dev ccache libvulkan1 mesa-vulkan-drivers

      # The runners have no GPU: Mesa lavapipe is the Vulkan driver Dawn gets. Pin whichever ICD file is installed (so the loader
      # cannot pick anything else), and fail here, not in the tests, when there is none.
      - name: Select the lavapipe Vulkan driver
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -n "$icd"
          echo "Using $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

      # ccache: PRs only restore the cache that master pushes saved; the cache is per job and compiler. A miss or a failure here
      # only means a cold build.
      - name: Restore ccache
        id: ccache-restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-webgpu-x86_64-gcc14-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-webgpu-x86_64-gcc14-

      - name: Reset ccache statistics
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          ccache --show-config | grep -E " (cache_dir|max_size|base_dir|hash_dir|compiler_check) = " || true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DN2ENGINE_BUILD_TESTS=ON -DN2ENGINE_USE_PHYSX=OFF -DN2ENGINE_RENDERER_VULKAN=OFF -DN2ENGINE_RENDERER_WEBGPU=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel --target webgpu_tests -- -k 0

      # -V: ctest hides a passing test's output, and the adapter line and the memory numbers are worth having in the log
      - name: Test
        run: ctest --test-dir build --output-on-failure -V --timeout 600 -R webgpu_tests
        env:
          # No adapter fails the tests instead of skipping them, and the adapter must be a CPU one (lavapipe), so a green run
          # means they executed on the pinned device
          N2_REQUIRE_WEBGPU: "1"
          N2_WEBGPU_EXPECT_CPU_DEVICE: "1"

      # Runs after a failed build or test too (not when cancelled): the hit rate of this run, from zeroed statistics
      - name: ccache statistics
        if: "!cancelled()"
        continue-on-error: true
        run: |
          {
            echo "### ccache (webgpu-x86_64-gcc14)"
            echo "restored cache: ${{ steps.ccache-restore.outputs.cache-matched-key || 'none (cold build)' }}"
            echo '```'
            ccache -s
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ccache -s

      # Only a push to master saves (never a pull request, never workflow_dispatch); master runs are never cancelled, so a
      # partial cache from a cancelled run cannot be saved. Entries are immutable, so the key carries the run id.
      - name: Save ccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-webgpu-x86_64-gcc14-${{ github.run_id }}-${{ github.run_attempt }}
